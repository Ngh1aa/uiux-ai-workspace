<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Lịch hẹn · Mobile browser prototype</title>
  <link rel="stylesheet" href="./preview.css">
  <script src="./preview.js" defer></script>
</head>
<body>
  <aside class="review-controls" aria-label="Điều khiển bản demo">
    <span><strong>Mobile prototype</strong> · Dữ liệu mẫu, không tạo lịch hẹn thật</span>
    <div>
      <label for="scenario">Trạng thái</label>
      <select id="scenario"><option value="ready">Bình thường</option><option value="offline">Mất kết nối</option><option value="empty">Lịch trống</option></select>
      <button id="reset-demo" type="button">Đặt lại demo</button>
    </div>
  </aside>
  <div class="phone">
    <main id="app" aria-label="Ứng dụng lịch hẹn"></main>
    <nav class="tab-bar" aria-label="Điều hướng chính">
      <button type="button" data-screen="home">Đặt lịch</button>
      <button type="button" data-screen="bookings">Lịch của tôi <span id="booking-count"></span></button>
    </nav>
  </div>
  <p id="announcement" class="sr-only" aria-live="polite"></p>
  <noscript>Bật JavaScript để trải nghiệm prototype tương tác.</noscript>
</body>
</html>
