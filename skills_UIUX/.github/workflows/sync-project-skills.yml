name: Sync Consumer Project Skills

on:
  workflow_call:
    inputs:
      source_ref:
        description: "skills_UIUX branch, tag, or commit to install"
        required: false
        default: "main"
        type: string
      sync_branch:
        description: "Branch used for the update pull request"
        required: false
        default: "chore/sync-uiux-skills"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out consumer project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the requested skills_UIUX revision
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/skills_UIUX"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/Ngh1aa/skills_UIUX.git
          git -C "$source_dir" fetch --depth=1 origin "$SOURCE_REF"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          echo "path=$source_dir" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C "$source_dir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate source library and synchronize selected skills
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.path }}
        run: |
          set -euo pipefail
          python "$SOURCE_DIR/scripts/validate-skills.py"
          python "$SOURCE_DIR/scripts/validate-v2.py"
          python "$SOURCE_DIR/scripts/install-project.py" "$GITHUB_WORKSPACE"

      - name: Run project-specific UI/UX validation when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/validate-uiux-skills.py ]; then
            python scripts/validate-uiux-skills.py --root "$GITHUB_WORKSPACE"
          fi

      - name: Open or update the synchronization pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SYNC_BRANCH: ${{ inputs.sync_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .claude/skills && [ -z "$(git status --porcelain -- .claude/skills)" ]; then
            echo "UI/UX skills are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add .claude/skills
          git commit -m "chore: sync skills_UIUX ${SOURCE_SHA:0:12}"
          git push --force-with-lease origin "HEAD:$SYNC_BRANCH"
          pr_number="$(gh pr list --head "$SYNC_BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "chore: sync skills_UIUX ${SOURCE_SHA:0:12}" --body "Automated sync from skills_UIUX commit $SOURCE_SHA."
          else
            gh pr create --base "$DEFAULT_BRANCH" --head "$SYNC_BRANCH" --title "chore: sync skills_UIUX ${SOURCE_SHA:0:12}" --body "Automated sync from skills_UIUX commit $SOURCE_SHA."
          fi
