<!doctype html><html lang="vi" data-brand="school"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nhà Trường — Cùng con mỗi ngày</title><link rel="stylesheet" href="../../../../design-system/fonts/fonts.css"><link rel="stylesheet" href="../../../../design-system/generated/tokens.css"><link rel="stylesheet" href="../../../../design-system/components/components.css"><link rel="stylesheet" href="../assets/ui.css"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="../assets/directions.css"><script>if(new URLSearchParams(location.search).get("direction")==="alternate")document.documentElement.dataset.direction="alternate";</script></head><body><header class="preview-header"><div><h1>Nhà Trường</h1><p class="demo-label">Browser preview cho iOS và Android. Dữ liệu minh hoạ, ngày 22/10/2025.</p></div><div class="row"><div class="platform-switch segmented" role="tablist" aria-label="Nền tảng xem trước"><button role="tab" aria-selected="true" data-platform="iOS">iOS</button><button role="tab" aria-selected="false" data-platform="Android">Android</button></div><button data-theme-toggle aria-label="Đổi sáng tối"><span data-icon="moon"></span></button></div></header><main class="platform-gallery">
<article class="platform ios-preview" data-platform-container="iOS"><p class="platform-caption">iOS / danh sách nhóm và sheet</p><div class="phone ios"><div class="statusbar"><span>19:41</span><span>Nhà Trường</span></div><section data-screen="iOS Hôm nay" data-view="home"></section><section data-screen="iOS Chi tiết bài tập" data-view="assignment" hidden></section><section data-screen="iOS Xin nghỉ" data-view="request" hidden></section><section data-screen="iOS Huỷ đơn" data-view="cancel" hidden></section><nav class="bottom-nav" aria-label="iOS điều hướng"><button data-view-go="home" aria-current="page"><span data-icon="home"></span>Hôm nay</button><button data-view-go="assignment"><span data-icon="document"></span>Bài tập</button><button data-view-go="request"><span data-icon="calendar-plus"></span>Xin nghỉ</button></nav><div class="home-indicator" aria-hidden="true"></div></div></article>
<article class="platform android-preview" data-platform-container="Android"><p class="platform-caption">Android / Material 3 và form toàn màn</p><div class="phone android"><div class="statusbar"><span>19:41</span><span>Nhà Trường</span></div><section data-screen="Android Hôm nay" data-view="home"></section><section data-screen="Android Chi tiết bài tập" data-view="assignment" hidden></section><section data-screen="Android Xin nghỉ" data-view="request" hidden></section><section data-screen="Android Huỷ đơn" data-view="cancel" hidden></section><nav class="bottom-nav" aria-label="Android điều hướng"><button data-view-go="home" aria-current="page"><span class="nav-pill" data-icon="home"></span>Hôm nay</button><button data-view-go="assignment"><span class="nav-pill" data-icon="document"></span>Bài tập</button><button data-view-go="request"><span class="nav-pill" data-icon="calendar-plus"></span>Xin nghỉ</button></nav><div class="home-indicator" aria-hidden="true"></div></div></article></main>
<script src="../assets/common.js"></script><script>
const tasks=[{name:'Tập đọc: Cây dừa',subject:'Tiếng Việt',due:'thứ Năm 23/10, 20:00',description:'Nộp ảnh bài làm cho cô. Nội dung yêu cầu chi tiết chưa được cung cấp trong dữ liệu mẫu.'},{name:'Bài 14: Phép cộng có nhớ',subject:'Toán',due:'thứ Sáu 24/10, 20:00',description:'Nộp ảnh bài làm cho cô. Nội dung yêu cầu chi tiết chưa được cung cấp trong dữ liệu mẫu.'}];const models={};document.querySelectorAll('[data-platform-container]').forEach(container=>{const platform=container.dataset.platformContainer,isIOS=platform==='iOS';const model=models[platform]={view:'home',task:0,submitted:[false,false],files:['',''],draft:{date:'2025-10-23',session:'Cả ngày',reason:'',note:''},requests:[{date:'2025-10-27',session:'Cả ngày',reason:'Đi khám răng',note:''}],cancelIndex:0,message:''};const section=view=>container.querySelector(`[data-view="${view}"]`);const select=s=>container.querySelector(s);const back=label=>isIOS?`<button class="back native-back" data-go="home">‹ ${label||'Hôm nay'}</button>`:`<header class="android-top"><button class="up-button" data-go="home" aria-label="Quay lại Hôm nay">${icon('chevron-left')}</button><h1>${label}</h1></header>`;function dateLabel(value){const date=new Date(value+'T12:00:00Z');return new Intl.DateTimeFormat('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',timeZone:'UTC'}).format(date);}function render(view=model.view,push=true){if(push&&view!==model.view)history.pushState({platform,view},"","?platform="+platform+"&screen="+platform+"-"+view);model.view=view;container.querySelectorAll('[data-view]').forEach(s=>s.hidden=s.dataset.view!==view);container.querySelector('.bottom-nav').hidden=['request','cancel'].includes(view);if(view==='home')home();if(view==='assignment')assignment();if(view==='request')request();if(view==='cancel')cancel();container.querySelectorAll('[data-view-go]').forEach(b=>{if(b.dataset.viewGo===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});bind();}function bind(){container.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));container.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{model.task=+b.dataset.task;render('assignment');});container.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{model.cancelIndex=+b.dataset.cancel;render('cancel');section('cancel').querySelector('.confirm-panel button').focus();});}function home(){const count=model.submitted.filter(v=>!v).length;section('home').innerHTML=`${isIOS?'<div class="ios-top"><span>Trường Tiểu học Minh hoạ</span></div><h1 class="ios-large">Hôm nay</h1>':'<header class="android-home-top"><h1>Hôm nay</h1><span class="child-avatar">H</span></header>'}<div class="native-body stack"><div class="student-line"><span class="child-avatar">H</span><div><strong>Trần Gia Hân</strong><p class="meta">Lớp 2/3, cô Lê Thu Hà</p>${isIOS?'':'<p class="meta">Trường Tiểu học Minh hoạ</p>'}</div></div>${model.message?`<p class="success native-status" role="status">${escapeHTML(model.message)}</p>`:''}<div class="task-group"><div class="native-section-head"><h2>Bài cần nộp</h2><strong class="count-badge">${count}</strong></div><div class="grouped-list">${tasks.map((t,i)=>`<button class="native-row" data-task="${i}"><span><strong>${t.name}</strong><small>${t.subject}, hạn ${t.due}</small></span><span class="${model.submitted[i]?'submitted-label':'due-label'}">${model.submitted[i]?'Đã nộp':'Chưa nộp'}</span>${icon('chevron-right')}</button>`).join('')}</div></div><div><div class="native-section-head"><h2>Ngày mai, thứ Năm 23/10</h2></div><div class="grouped-list timetable"><p>Tiếng Việt <span>Toán</span></p><p>Tự nhiên và Xã hội <span>Âm nhạc</span></p><div class="dismissal">Tan học <strong>16:30</strong></div></div></div><div><div class="native-section-head"><h2>Tin từ cô Hà</h2><span class="meta">19:12 hôm nay</span></div><article class="grouped-list teacher-note"><p>Thứ Bảy 25/10 trường tổ chức ngày hội đọc sách, phụ huynh đăng ký tham gia trước thứ Năm.</p></article></div><div><div class="native-section-head"><h2>Đơn xin nghỉ</h2>${isIOS?'<button class="text-button" data-go="request">Tạo đơn</button>':''}</div><div class="grouped-list">${model.requests.length?model.requests.map((r,i)=>`<div class="leave-row"><div><strong>${r.session}, ${dateLabel(r.date)}</strong><p>${escapeHTML(r.reason)}</p>${r.note?'<p class="meta">'+escapeHTML(r.note)+'</p>':''}<small>Đã gửi trong dữ liệu mẫu</small></div><button class="cancel-link" data-cancel="${i}">Huỷ đơn</button></div>`).join(''):'<div class="leave-row"><p>Chưa có đơn xin nghỉ. Đơn mới sẽ hiện tại đây.</p></div>'}</div></div>${!isIOS?'<button class="fab" data-go="request">'+icon('plus')+' Xin nghỉ</button>':''}<p class="demo-label">Bản xem trên trình duyệt. Thao tác chỉ mô phỏng, không gửi tới giáo viên.</p></div>`;}function assignment(){const t=tasks[model.task];section('assignment').innerHTML=`${back(isIOS?'Hôm nay':'Bài tập')}<div class="native-body stack">${isIOS?'<h1>Bài tập</h1>':''}<div class="assignment-label row between"><span class="badge">${t.subject}</span><span class="badge">${model.submitted[model.task]?'Đã nộp minh hoạ':'Chưa nộp'}</span></div><h2 class="assignment-title">${t.name}</h2><p class="due-line">${icon('clock')} Hạn ${t.due}</p><div class="grouped-list assignment-copy"><h3>Yêu cầu bài tập</h3><p>${t.description}</p></div><div class="grouped-list assignment-copy stack-sm"><h3>Bài làm của Gia Hân</h3><p class="muted">${model.submitted[model.task]?'Ảnh đã được ghi nhận trong bản mẫu.':'Chọn ảnh rồi kiểm tra. Bản mẫu không gửi bài cho cô.'}</p><label class="file-label">${icon('document')} Chọn ảnh bài làm<input type="file" accept="image/*" id="${platform}-photo" aria-label="${platform} chọn ảnh bài làm"></label><p class="meta" id="${platform}-file-name">${model.files[model.task]?escapeHTML(model.files[model.task]):'Chưa chọn ảnh'}</p><p class="notice" id="${platform}-upload-error" role="alert" hidden></p></div><button class="ds-button ds-button--primary full" id="${platform}-submit-photo">${model.files[model.task]?'Nộp ảnh minh hoạ':'Kiểm tra ảnh'}</button><p class="demo-label">Ảnh chỉ đọc tên tệp tại máy. Bản mẫu không tải ảnh lên máy chủ.</p></div>`;select(`#${platform}-photo`).onchange=e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){select(`#${platform}-upload-error`).hidden=false;select(`#${platform}-upload-error`).textContent='Chọn tệp ảnh để tiếp tục.';return;}model.files[model.task]=file.name;select(`#${platform}-file-name`).textContent=file.name;select(`#${platform}-submit-photo`).textContent='Nộp ảnh minh hoạ';select(`#${platform}-upload-error`).hidden=true;};select(`#${platform}-submit-photo`).onclick=()=>{if(!model.files[model.task]){select(`#${platform}-upload-error`).hidden=false;select(`#${platform}-upload-error`).textContent='Bạn chưa chọn ảnh. Chọn ảnh bài làm rồi gửi lại.';return;}model.submitted[model.task]=true;model.message='Đã ghi nhận ảnh bài làm trong bản mẫu.';render('home');};}function request(){const d=model.draft;section('request').innerHTML=`${isIOS?'<div class="sheet-context"><p>Hôm nay</p><strong>Trần Gia Hân, lớp 2/3</strong></div>':''}<div class="request-panel ${isIOS?'ios-sheet':'android-form'}" ${isIOS?'role="dialog" aria-modal="true" aria-label="Xin nghỉ cho Gia Hân"':''}>${isIOS?'<div class="sheet-handle" aria-hidden="true"></div><header class="sheet-bar"><button class="text-button" data-go="home">Huỷ</button><strong>Xin nghỉ</strong><span class="sheet-bar-spacer" aria-hidden="true"></span></header>':'<header class="android-top"><button class="up-button" data-go="home" aria-label="Quay lại Hôm nay">'+icon('chevron-left')+'</button><h1>Xin nghỉ</h1></header>'}<form class="native-body stack leave-form" novalidate><p class="muted">Trần Gia Hân, lớp 2/3</p><label class="field">Ngày nghỉ<span class="date-choice"><span class="date-display">${dateLabel(d.date)}</span><input name="date" type="date" lang="vi-VN" value="${d.date}" required aria-describedby="${platform}-date-help ${platform}-form-error"></span></label><p id="${platform}-date-help" class="meta">Hôm nay trong bản mẫu: 22/10/2025.</p><p class="notice form-error" id="${platform}-form-error" role="alert" hidden></p><label class="field">Buổi nghỉ<select name="session">${['Sáng','Chiều','Cả ngày'].map(s=>`<option ${s===d.session?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">Lý do<input name="reason" value="${escapeHTML(d.reason)}" placeholder="Ví dụ: con bị sốt" required></label><label class="field">Ghi chú cho cô<textarea name="note" placeholder="Thông tin thêm, không bắt buộc">${escapeHTML(d.note)}</textarea></label><div class="soft"><p>Người nhận dự kiến: cô Lê Thu Hà</p><p class="meta">Chỉ lưu đơn minh hoạ trên máy này, chưa gửi cho cô.</p></div>${isIOS?'<button type="submit" class="ds-button ds-button--primary full">Gửi đơn xin nghỉ</button>':'<button type="submit" class="ds-button ds-button--primary full">Gửi đơn xin nghỉ</button><button type="button" data-go="home">Huỷ, quay lại Hôm nay</button>'}<p class="demo-label">Đơn chỉ lưu trong phiên xem trước.</p></form></div>`;const form=section('request').querySelector('form');form.oninput=()=>{const data=new FormData(form);model.draft=Object.fromEntries(data.entries());const visibleDate=form.querySelector('.date-display');if(visibleDate&&form.elements.date.value)visibleDate.textContent=dateLabel(form.elements.date.value);};form.onsubmit=e=>{e.preventDefault();const data=new FormData(form),date=String(data.get('date')),reason=String(data.get('reason')).trim(),error=form.querySelector('.form-error');if(!date||date<'2025-10-22'){error.textContent='Ngày nghỉ đã qua. Chọn ngày từ 22/10/2025 trở đi; nội dung bạn nhập vẫn được giữ.';error.hidden=false;form.elements.date.setAttribute('aria-invalid','true');form.elements.date.focus();return;}if(!reason){error.textContent='Nhập lý do nghỉ để cô nắm thông tin. Các lựa chọn khác vẫn được giữ.';error.hidden=false;form.elements.reason.setAttribute('aria-invalid','true');form.elements.reason.focus();return;}model.requests.push({date,session:String(data.get('session')),reason,note:String(data.get('note'))});model.message='Đã lưu đơn minh hoạ: '+data.get('session')+', '+dateLabel(date)+'.';model.draft={date,session:String(data.get('session')),reason:'',note:''};render('home');};}function cancel(){const r=model.requests[model.cancelIndex];if(!r){render('home');return;}section('cancel').innerHTML=`<div class="cancel-background" aria-hidden="true"><h1>Hôm nay</h1><div class="grouped-list"><strong>Trần Gia Hân</strong><p>Đơn nghỉ ${r.session}, ${dateLabel(r.date)}</p><p>${escapeHTML(r.reason)}</p></div></div><div class="local-scrim"></div><div class="confirm-panel ${isIOS?'ios-alert':'android-dialog'}" role="alertdialog" aria-modal="true" aria-labelledby="${platform}-cancel-title" aria-describedby="${platform}-cancel-desc"><h2 id="${platform}-cancel-title">Huỷ đơn xin nghỉ?</h2><p id="${platform}-cancel-desc">${r.session}, ${dateLabel(r.date)}<br>Lý do: ${escapeHTML(r.reason)}<br>Chỉ cập nhật bản mẫu trên máy này; chưa gửi thông báo cho cô.</p><div class="confirm-actions"><button class="text-button keep-request">Giữ đơn</button><button class="cancel-confirm">Huỷ đơn</button></div></div>`;select('.keep-request').onclick=()=>render('home');select('.cancel-confirm').onclick=()=>{model.requests.splice(model.cancelIndex,1);model.message='Đã huỷ đơn xin nghỉ trong bản mẫu.';render('home');};}container.querySelectorAll('[data-view-go]').forEach(b=>b.onclick=()=>render(b.dataset.viewGo));container.addEventListener('keydown',e=>{if(!['request','cancel'].includes(model.view))return;if(e.key==='Escape'){e.preventDefault();render('home');}if(e.key==='Tab'){const root=section(model.view),els=[...root.querySelectorAll('button,input,select,textarea')].filter(el=>!el.disabled&&!el.hidden);if(!els.length)return;if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus();}}});model.navigate=render;render();});document.querySelectorAll('[data-platform]').forEach(b=>b.onclick=()=>{document.body.dataset.preview=b.dataset.platform;history.pushState({platform:b.dataset.platform,view:models[b.dataset.platform].view},"","?platform="+b.dataset.platform+"&screen="+b.dataset.platform+"-"+models[b.dataset.platform].view);document.querySelectorAll('[data-platform]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));});document.body.dataset.preview=new URLSearchParams(location.search).get('platform')||'iOS';const requested=new URLSearchParams(location.search).get('screen');if(requested){for(const p of ['iOS','Android'])if(requested.startsWith(p)){const view={home:'home',assignment:'assignment',request:'request',cancel:'cancel'}[requested.split('-')[1]];if(view)models[p].navigate(view,false);}}
window.addEventListener("popstate",()=>{const q=new URLSearchParams(location.search),platform=q.get("platform")||"iOS",view=(q.get("screen")||platform+"-home").split("-")[1];document.body.dataset.preview=platform;if(models[platform])models[platform].navigate(["home","assignment","request","cancel"].includes(view)?view:"home",false);});</script></body></html>
