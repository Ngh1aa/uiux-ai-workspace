<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Nhà Trường iOS và Android</title>
<link rel="stylesheet" href="../../../../design-system/fonts/fonts.css">
<link rel="stylesheet" href="../../../../design-system/fonts/pairs.css">
<link rel="stylesheet" href="../../../../design-system/generated/tokens.css">
<link rel="stylesheet" href="../../../../design-system/components/components.css">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="../../../../design-system/starter/app.css">
<link rel="stylesheet" href="../../../../design-system/starter/native.css">
<style>
body { margin: 0; background: var(--ds-surface-sunken); color: var(--ds-text-primary); font-family: var(--ds-font-family-sans); }
.gal { display: flex; flex-wrap: wrap; gap: 40px 32px; padding: 32px; justify-content: center; }
.gal__item { display: flex; flex-direction: column; gap: 8px; }
.gal__name { margin: 0; color: var(--ds-text-secondary); font: var(--ds-font-weight-semibold) 14px/20px var(--ds-font-family-sans); }
.app-phone.md-phone { border-radius: 36px; }
.app-status { height: 44px; padding-top: 4px; }
.app-status__time { font-size: 15px; }
.md .app-status { padding: 4px 24px 0; }
.md .app-status__time { font-size: 14px; font-weight: var(--ds-font-weight-medium); }
button { font: inherit; color: inherit; }
.rst { border: 0; background: none; padding: 0; margin: 0; text-align: left; cursor: pointer; width: 100%; }
.num { font-family: var(--app-font-display); font-variant-numeric: tabular-nums; }

/* Thẻ bài chưa nộp: thẻ nổi bật duy nhất mỗi màn */
.hero { display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: var(--ds-card-radius); background: var(--ds-surface-brand-strong); color: var(--ds-text-on-brand-strong); }
.hero__label { margin: 0; font: var(--ds-font-weight-semibold) 15px/20px var(--ds-font-family-sans); }
.hero__big { margin: 0; display: flex; align-items: baseline; gap: 8px; font: var(--ds-font-weight-bold) 48px/52px var(--app-font-display); letter-spacing: -0.02em; }
.hero__big small { font: var(--ds-font-weight-semibold) 17px/22px var(--ds-font-family-sans); letter-spacing: 0; }
.hero__ctx { margin: 0; font-size: 14px; line-height: 20px; color: color-mix(in srgb, var(--ds-text-on-brand-strong) 88%, transparent); }

.avatar { display: grid; place-items: center; flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--ds-surface-brand-subtle); color: var(--ds-text-brand); font: var(--ds-font-weight-bold) 17px/1 var(--app-font-display); }
.chip { display: inline-flex; align-items: center; gap: 4px; flex: none; min-height: 24px; padding: 0 8px; border-radius: 999px; font: var(--ds-font-weight-semibold) 12px/16px var(--ds-font-family-sans); white-space: nowrap; }
.chip--todo { background: var(--ds-feedback-warning-surface); color: var(--ds-feedback-warning-text); }
.chip--ok { background: var(--ds-feedback-success-surface); color: var(--ds-feedback-success-text); }
.chip--off { background: var(--ds-feedback-neutral-surface); color: var(--ds-feedback-neutral-text); }
.status-card { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--ds-card-radius); background: var(--ds-feedback-success-surface); color: var(--ds-feedback-success-text); font: var(--ds-font-weight-semibold) 15px/20px var(--ds-font-family-sans); }
.status-card .ds-icon { flex: none; }
.notice { margin: 0; font-size: 16px; line-height: 24px; }
.meta { color: var(--ds-text-secondary); font-size: 14px; line-height: 20px; }
.para { margin: 0; font-size: 16px; line-height: 24px; }
.dtitle { margin: 0; font: var(--ds-font-weight-bold) 26px/32px var(--app-font-display); letter-spacing: -0.01em; }

/* Chọn ngày dạng dải ngày, dùng chung hai nền tảng */
.days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.day { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; width: 48px; min-height: 56px; border: 1px solid var(--ds-border-control); border-radius: var(--ds-shape-control); background: var(--ds-surface-raised); cursor: pointer; }
.day span[aria-hidden] { font-size: 12px; line-height: 16px; color: var(--ds-text-secondary); }
.day b { font: var(--ds-font-weight-bold) 15px/20px var(--app-font-display); font-variant-numeric: tabular-nums; }
.day[aria-pressed="true"] { border-color: var(--ds-action-primary-bg); background: var(--ds-action-primary-bg); color: var(--ds-action-primary-text); }
.day[aria-pressed="true"] span[aria-hidden] { color: inherit; }
.day.is-past:not([aria-pressed="true"]) b { color: var(--ds-text-secondary); }
.has-error .day[aria-pressed="true"] { border-color: var(--ds-action-danger-bg); background: var(--ds-action-danger-bg); }
.field-err { display: flex; gap: 6px; align-items: flex-start; margin: 0; color: var(--ds-feedback-danger-text); font-size: 14px; line-height: 20px; }
.field-err .ds-icon { width: 18px; height: 18px; margin-top: 1px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; border-radius: 10px; background: var(--ds-surface-sunken); }
.seg button { min-height: 44px; border: 0; border-radius: 8px; background: none; font-size: 15px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ds-surface-raised); font-weight: var(--ds-font-weight-semibold); box-shadow: 0 1px 3px color-mix(in srgb, var(--ds-text-primary) 18%, transparent); }
.seg-wrap { padding: 2px 0; }

/* Thanh đáy cố định cho hành động chính; nội dung có khoảng đệm bằng chiều cao thanh */
.actbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 34px; background: var(--ds-surface-raised); border-top: 0.5px solid var(--ds-border-subtle); }
.actbar__why { margin: 0; color: var(--ds-text-secondary); font-size: 14px; line-height: 20px; text-align: center; }
.btn-main { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border: 0; border-radius: var(--ds-shape-control); background: var(--ds-action-primary-bg); color: var(--ds-action-primary-text); font: var(--ds-font-weight-semibold) 17px/22px var(--ds-font-family-sans); cursor: pointer; }
.btn-main[aria-disabled="true"] { background: var(--ds-action-disabled-bg); color: var(--ds-action-disabled-text); cursor: not-allowed; }
.md .btn-main { min-height: 48px; border-radius: 24px; font-size: 15px; font-weight: var(--ds-font-weight-medium); }
.ios .ios-body.pad-act { padding-bottom: 150px; }

/* ---------- iOS ---------- */
.ios .ios-body { gap: 28px; }
.ios-row.rst { min-height: 44px; padding: 8px 16px; }
.ios-row__title { font-size: 17px; }
.ios-head { margin: 0; padding: 0 16px; color: var(--ds-text-secondary); font: var(--ds-font-weight-semibold) 15px/20px var(--ds-font-family-sans); }
.ios-card { padding: 12px 16px; border-radius: var(--ds-card-radius); background: var(--ds-surface-raised); display: flex; flex-direction: column; gap: 6px; }
.ios-danger { width: 100%; min-height: 50px; border: 0; border-radius: var(--ds-shape-control); background: var(--ds-surface-raised); color: var(--ds-action-danger-bg); font-size: 17px; cursor: pointer; }
.ios-tabs { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; justify-content: space-around; align-items: center; padding: 8px 16px 30px; border-top: 0.5px solid var(--ds-border-subtle); background: color-mix(in srgb, var(--ds-surface-raised) 94%, transparent); backdrop-filter: blur(20px); }
.tab { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 48px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 22px; background: none; color: var(--ds-text-secondary); cursor: pointer; font: var(--ds-font-weight-semibold) 14px/20px var(--ds-font-family-sans); }
.tab .ds-icon { width: 24px; height: 24px; }
.tab[aria-current="page"] { padding: 0 16px 0 12px; background: var(--ds-surface-brand-subtle); color: var(--ds-text-brand); }
.tab:not([aria-current="page"]) .tab__label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ios-sheet .ios-body { padding-bottom: 180px; }
.ios-input { width: 100%; min-height: 44px; border: 0; background: none; color: var(--ds-text-primary); font: inherit; font-size: 17px; }
.ios-input::placeholder, .md-field textarea::placeholder, .md-field input::placeholder { color: var(--ds-text-secondary); }
textarea.ios-input { min-height: 104px; padding: 11px 0; resize: none; line-height: 22px; }
.ios-block { padding: 12px 16px; border-radius: var(--ds-card-radius); background: var(--ds-surface-raised); display: flex; flex-direction: column; gap: 10px; }
.ios-block.has-error { box-shadow: inset 0 0 0 1.5px var(--ds-action-danger-bg); }
.ios-asheet { position: absolute; left: 8px; right: 8px; bottom: 34px; z-index: 5; display: flex; flex-direction: column; gap: 8px; }
.ios-asheet__grp { overflow: hidden; border-radius: 14px; background: var(--ds-surface-raised); }
.ios-asheet button { display: block; width: 100%; min-height: 56px; border: 0; background: none; color: var(--nt-tint); font-size: 20px; cursor: pointer; }
.ios-asheet__grp button + button { border-top: 0.5px solid var(--ds-border-subtle); }
.ios-asheet .is-cancel { font-weight: var(--ds-font-weight-semibold); }

.ios .ios-group { border-radius: var(--ds-card-radius); }
.ios .ios-input { height: 44px; }
.ios textarea.ios-input { height: auto; }
.who { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
.who__name { margin: 0; font: var(--ds-font-weight-bold) 24px/30px var(--app-font-display); letter-spacing: -0.01em; }
.who > div { min-width: 0; }
.who__name, .who .meta { margin: 0; overflow-wrap: anywhere; }
.work { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px 16px; border-radius: var(--ds-card-radius); background: var(--ds-surface-raised); }
.work__ic { display: grid; place-items: center; flex: none; width: 48px; height: 48px; border-radius: var(--ds-shape-control); background: var(--ds-surface-sunken); color: var(--ds-text-secondary); }
.work b { display: block; font-size: 16px; line-height: 22px; font-weight: var(--ds-font-weight-semibold); }
.dlg-data { display: flex; flex-direction: column; gap: 2px; }
/* ---------- Android ---------- */
.md .md-card { border-radius: var(--ds-card-radius); }
.md .md-topbar { padding: 0 16px 0 4px; }
.md .md-topbar__title.is-root { margin-left: 12px; padding: 0; }
.md .md-field input { height: 48px; }
.md-btn--outline-danger { width: 100%; background: none; color: var(--ds-action-danger-bg); box-shadow: inset 0 0 0 1px var(--ds-border-control); }
.md .md-body { gap: 16px; }
.md-title-sm { margin: 0; padding: 8px 4px 0; color: var(--ds-text-brand); font: var(--ds-font-weight-semibold) 14px/20px var(--ds-font-family-sans); }
.md-surface { overflow: hidden; border-radius: var(--ds-card-radius); background: var(--ds-surface-raised); }
.md-item.rst { min-height: 72px; padding: 12px 16px; }
.md-item__chip { margin-top: 6px; }
.md-li { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px; padding: 0 16px; font-size: 16px; }
.md-li + .md-li, .md-item + .md-item { border-top: 1px solid var(--ds-border-subtle); }
.md-nav { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; justify-content: space-around; align-items: center; padding: 12px 16px 28px; background: var(--ds-surface-raised); }
.md-nav .tab { min-height: 48px; border-radius: 24px; }
.md-nav .tab[aria-current="page"] { background: var(--ds-action-selected-bg); color: var(--ds-action-selected-text); }
.md .md-fab { bottom: 112px; border: 0; cursor: pointer; }
.md .md-fab.is-up { bottom: 176px; }
.md-snack { position: absolute; left: 16px; right: 16px; bottom: 104px; z-index: 4; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 4px 4px 16px; border-radius: 6px; background: var(--ds-surface-inverse); color: var(--ds-text-on-inverse); font-size: 14px; line-height: 20px; box-shadow: var(--ds-elevation-floating); }
.md-snack.is-low { bottom: 40px; }
.md-snack span { flex: 1; }
.md-snack button { min-height: 48px; padding: 0 12px; border: 0; background: none; color: var(--ds-text-on-inverse); font-weight: var(--ds-font-weight-semibold); cursor: pointer; }
.md-field { min-height: 56px; }
.md-field__label { background: var(--ds-surface-page); }
.md-field textarea { padding: 16px 0; min-height: 136px; }
.md-group { display: flex; flex-direction: column; gap: 10px; }
.md-group__label { margin: 0; color: var(--ds-text-secondary); font-size: 14px; line-height: 20px; font-weight: var(--ds-font-weight-medium); }
.md .seg { padding: 0; gap: 0; border-radius: 24px; background: none; box-shadow: inset 0 0 0 1px var(--ds-border-control); overflow: hidden; }
.md .seg button { min-height: 48px; border-radius: 0; font-size: 14px; font-weight: var(--ds-font-weight-medium); }
.md .seg button + button { border-left: 1px solid var(--ds-border-control); }
.md .seg button[aria-pressed="true"] { background: var(--ds-action-selected-bg); color: var(--ds-action-selected-text); box-shadow: none; }
.md-bsheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 8px 0 36px; border-radius: 28px 28px 0 0; background: var(--ds-surface-raised); }
.md-bsheet__handle { width: 32px; height: 4px; margin: 14px auto 12px; border-radius: 2px; background: var(--ds-border-control); }
.md-bsheet button { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 56px; padding: 0 24px; border: 0; background: none; font-size: 16px; cursor: pointer; text-align: left; }
.md-dialog .md-btn { min-height: 48px; }
.md-actbar { padding-bottom: 28px; }
@media (max-width: 430px) { .gal { padding: 0; gap: 0; } .gal__name { padding: 12px 16px; } }
</style>
</head>
<body class="ds-root">

  <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>

<main class="gal">
  <div class="gal__item"><p class="gal__name" data-annotation>iOS Hôm nay</p><div class="app-phone nt ios" data-screen="iOS Hôm nay" data-p="ios" data-init="today"></div></div>
  <div class="gal__item"><p class="gal__name" data-annotation>iOS Chi tiết bài tập</p><div class="app-phone nt ios" data-screen="iOS Chi tiết bài tập" data-p="ios" data-init="hwd"></div></div>
  <div class="gal__item"><p class="gal__name" data-annotation>iOS Xin nghỉ</p><div class="app-phone nt ios" data-screen="iOS Xin nghỉ" data-p="ios" data-init="form"></div></div>
  <div class="gal__item"><p class="gal__name" data-annotation>iOS Hủy đơn</p><div class="app-phone nt ios" data-screen="iOS Hủy đơn" data-p="ios" data-init="cancel"></div></div>
  <div class="gal__item"><p class="gal__name" data-annotation>Android Hôm nay</p><div class="app-phone nt md md-phone" data-screen="Android Hôm nay" data-p="md" data-init="today"></div></div>
  <div class="gal__item"><p class="gal__name" data-annotation>Android Chi tiết bài tập</p><div class="app-phone nt md md-phone" data-screen="Android Chi tiết bài tập" data-p="md" data-init="hwd"></div></div>
  <div class="gal__item"><p class="gal__name" data-annotation>Android Xin nghỉ</p><div class="app-phone nt md md-phone" data-screen="Android Xin nghỉ" data-p="md" data-init="form"></div></div>
  <div class="gal__item"><p class="gal__name" data-annotation>Android Hủy đơn</p><div class="app-phone nt md md-phone" data-screen="Android Hủy đơn" data-p="md" data-init="cancel"></div></div>
</main>

<script>
(() => {
  const NOW = '20:41';
  const DAYS = [
    { d: '21/10', dow: 'thứ Ba', s: 'T3', past: true },
    { d: '22/10', dow: 'thứ Tư', s: 'T4' },
    { d: '23/10', dow: 'thứ Năm', s: 'T5' },
    { d: '24/10', dow: 'thứ Sáu', s: 'T6' },
    { d: '27/10', dow: 'thứ Hai', s: 'T2' },
    { d: '28/10', dow: 'thứ Ba', s: 'T3' }
  ];
  const SESSIONS = ['Sáng', 'Chiều', 'Cả ngày'];
  const TABS = [
    { id: 'today', label: 'Hôm nay', icon: 'i-home' },
    { id: 'hwlist', label: 'Bài tập', icon: 'i-task' },
    { id: 'leaves', label: 'Đơn nghỉ', icon: 'i-calplus' }
  ];
  const TITLES = { today: 'Hôm nay', hwlist: 'Bài tập', leaves: 'Đơn nghỉ', hwd: 'Bài tập', leave: 'Đơn xin nghỉ' };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ic = (id, cls = '') => `<svg class="ds-icon ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  function fresh(p) {
    return {
      p, view: 'today', arg: null, stack: [], overlay: null, flash: null,
      hw: [
        { id: 'cay-dua', title: 'Tập đọc: Cây dừa', subj: 'Tiếng Việt', due: 'Thứ Năm 23/10, 20:00', desc: 'Đọc to bài Cây dừa ba lần cùng bố mẹ, chép khổ thơ đầu vào vở ô li rồi chụp ảnh trang vở.', done: null },
        { id: 'bai-14', title: 'Bài 14: Phép cộng có nhớ', subj: 'Toán', due: 'Thứ Sáu 24/10, 20:00', desc: 'Làm bài 1, 2 và 3 trong vở bài tập Toán, trình bày phép tính theo cột dọc rồi chụp ảnh trang làm bài.', done: null }
      ],
      leaves: [{ id: 'l1', d: '27/10', dow: 'thứ Hai', session: 'Cả ngày', reason: 'Đi khám răng', note: '', status: 'sent' }],
      form: { date: null, session: 'Cả ngày', reason: '', note: '' }
    };
  }

  const leaveTitle = l => `Nghỉ ${l.session.toLowerCase()} ${l.dow} ${l.d}`;
  const todo = st => st.hw.filter(h => !h.done);
  const work = h => `<div class="work" data-test="work"><span class="work__ic">${ic(h.done ? 'i-img' : 'i-cam')}</span><span><b>${h.done ? '1 ảnh đã nộp' : 'Chưa có ảnh'}</b><span class="meta">${h.done ? `Nộp lúc ${h.done}` : `Hạn ${h.due.replace('Thứ', 'thứ')}`}</span></span></div>`;
  const others = (st, h) => todo(st).filter(x => x.id !== h.id);
  const who = st => `<div class="who"><span class="avatar" aria-hidden="true">GH</span><div><p class="who__name">Trần Gia Hân</p><p class="meta">Lớp 2/3, gửi cô Lê Thu Hà</p></div></div>`;
  function formIssue(f) {
    const day = DAYS.find(x => x.d === f.date);
    if (!day) return { field: null, why: 'Chưa chọn ngày nghỉ' };
    if (day.past) return { field: `${cap(day.dow)} ${day.d} đã qua. Chọn từ thứ Tư 22/10.`, why: 'Ngày nghỉ đã qua' };
    if (!f.reason.trim()) return { field: null, why: 'Chưa nhập lý do' };
    return null;
  }

  /* ---------- Phần dùng chung theo nền tảng ---------- */
  function heroCard(st) {
    const t = todo(st);
    const next = t[0];

    const scroll = ph.querySelector('.nt-scroll');
    const keep = scroll && ph.dataset.view === st.view + (st.arg || '') ? scroll.scrollTop : 0;
    ph.innerHTML = `<div class="app-status"><span class="app-status__time">${NOW}</span></div><div class="nt-screen">${inner}${st.p === 'ios' ? '<span class="ios-home" aria-hidden="true"></span>' : '<span class="md-gesture" aria-hidden="true"></span>'}</div>`;
    ph.dataset.view = st.view + (st.arg || '');
    const ns = ph.querySelector('.nt-screen > .nt-scroll, .ios-sheet .nt-scroll');
    if (ns && keep) ns.scrollTop = keep;
  }
  function go(st, view, arg = null) { st.stack.push({ view: st.view, arg: st.arg }); st.view = view; st.arg = arg; st.overlay = null; st.flash = null; }
  function back(st) { const prev = st.stack.pop(); if (prev) { st.view = prev.view; st.arg = prev.arg; } st.overlay = null; }

  phones.forEach((ph, i) => {
    const st = fresh(ph.dataset.p); st.uid = `ph${i}`;
    states.set(ph, st);
    const init = ph.dataset.init;
    if (init === 'hwd') go(st, 'hwd', 'cay-dua');
    if (init === 'cancel') { go(st, 'leave', 'l1'); st.overlay = 'cancel'; }
    if (init === 'form') {
      st.form = { date: '21/10', session: 'Cả ngày', reason: 'Bị sốt', note: '' };
      if (st.p === 'ios') st.overlay = 'form'; else go(st, 'form');
    }
    render(ph);

    ph.addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el || !ph.contains(el)) return;
      const a = el.dataset.act;
      if (a === 'tab') { st.view = el.dataset.id; st.arg = null; st.stack = []; st.overlay = null; st.flash = null; }
      else if (a === 'open-hw') go(st, 'hwd', el.dataset.id);
      else if (a === 'open-leave') go(st, 'leave', el.dataset.id);
      else if (a === 'back') { back(st); st.flash = null; }
      else if (a === 'pick') st.overlay = 'pick';
      else if (a === 'close-overlay') st.overlay = null;
      else if (a === 'photo') { st.hw.find(x => x.id === st.arg).done = `${NOW} thứ Tư 22/10`; st.overlay = null; st.flash = 'Đã nộp ảnh bài làm'; }
      else if (a === 'ask-cancel') st.overlay = 'cancel';
      else if (a === 'do-cancel') {
        const l = st.leaves.find(x => x.id === st.arg); l.status = 'cancelled';
        back(st); st.flash = `Đã hủy đơn ${leaveTitle(l).charAt(0).toLowerCase() + leaveTitle(l).slice(1)}`;
      }
      else if (a === 'new-leave') {
        st.form = { date: null, session: 'Cả ngày', reason: '', note: '' }; st.flash = null;
        if (st.p === 'ios') st.overlay = 'form'; else go(st, 'form');
      }
      else if (a === 'close-form') { if (st.p === 'ios') st.overlay = null; else back(st); }
      else if (a === 'date') st.form.date = el.dataset.v;
      else if (a === 'session') st.form.session = el.dataset.v;
      else if (a === 'send') {
        if (el.getAttribute('aria-disabled') === 'true') return;
        const day = DAYS.find(x => x.d === st.form.date);
        const l = { id: 'l' + (st.leaves.length + 1), d: day.d, dow: day.dow, session: st.form.session, reason: st.form.reason.trim(), note: st.form.note, status: 'sent' };
        st.leaves.unshift(l);
        if (st.p === 'ios') st.overlay = null; else back(st);
        st.flash = `Đã gửi đơn ${leaveTitle(l).charAt(0).toLowerCase() + leaveTitle(l).slice(1)}`;
      }
      else if (a === 'dismiss-flash') st.flash = null;
      else return;
      render(ph);
      const focusT = ph.querySelector('[data-test="confirm-dismiss"], [data-test="result"], .ios-sheet .ios-link, [data-test="form"] .md-iconbtn');
      if (focusT && focusT.tagName === 'BUTTON') focusT.focus({ preventScroll: true });
    });
    ph.addEventListener('input', e => {
      const b = e.target.dataset.bind; if (!b) return;
      st.form[b] = e.target.value;
      const bar = ph.querySelector('.actbar'); const tmp = document.createElement('div');
      tmp.innerHTML = submitBar(st); bar.replaceWith(tmp.firstElementChild);
    });
    ph.addEventListener('keydown', e => {
      if (e.key === 'Escape' && (st.overlay === 'cancel' || st.overlay === 'pick')) { st.overlay = null; render(ph); }
    });
  });
})();
</script>
</body>
</html>
