name: Checks

# Hai job này mang đúng tên mà ruleset "Protect main" yêu cầu (foundation, release-candidate),
# nên chạy ở mọi push và pull request, không lọc theo đường dẫn.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skills_UIUX
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate SKILL.md structure
        run: python scripts/validate-skills.py
      - name: Static page checker tests (no Playwright needed)
        run: node --test ui-craft-and-visual-qa/scripts/static-check.test.cjs
      - name: Internal Markdown links resolve
        working-directory: .
        run: python scripts/check-links.py
      - name: Benchmark report matches recorded runs
        working-directory: .
        run: python benchmarks/report.py --check
      - name: Benchmark provenance and result validation tests
        working-directory: .
        run: python -m unittest discover -s benchmarks -p "test_*.py"
      - name: Independent review packet tests
        working-directory: .
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Brownfield overlay checker tests
        working-directory: .
        run: python -m unittest discover -s skills_UIUX/brownfield-redesign/scripts -p "test_*.py"

  release-candidate:
    name: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<9"
      - name: Design system generated files are current
        run: python design-system/scripts/build.py --check
      - name: Native token exports are up to date
        run: python design-system/scripts/export-native.py --check
      - name: Validate tokens, layering, contrast and component CSS
        run: python design-system/scripts/validate.py --report
      - name: Design system regression and negative tests
        run: python -m pytest -q design-system/tests
      - name: Starter brand layer passes the brand check
        run: python design-system/scripts/check-brand.py design-system/starter/brand.css design-system/examples/gom-moc/brand.css
      - name: Starter kit icons are current
        run: python design-system/starter/inline-icons.py --check design-system/starter/mobile.html design-system/starter/web.html design-system/starter/web-states.html design-system/starter/landing.html design-system/starter/desktop.html design-system/starter/mobile-ios.html design-system/starter/mobile-android.html design-system/patterns/index.html design-system/examples/gom-moc/landing.html design-system/examples/gom-moc/app.html
      - name: Install Playwright Chromium outside the repo
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1 axe-core@4
          npx playwright install --with-deps chromium
      - name: Taste checker tests
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: node --test skills_UIUX/ui-craft-and-visual-qa/scripts/taste-check.test.cjs
      - name: Booking selection, confirmation and edit regression
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: node --test design-system/tests/gom-moc-flow.test.cjs
      - name: Starter kit passes the taste check
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: >-
          node skills_UIUX/ui-craft-and-visual-qa/scripts/taste-check.cjs
          design-system/starter/mobile.html design-system/starter/web.html design-system/starter/web-states.html
          design-system/starter/landing.html
          --width 390 --width 768 --width 1024 --width 1280 --width 1440 --screenshot "$RUNNER_TEMP/starter-shots"
      - name: Desktop app shells pass the strict layout check
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: >-
          node skills_UIUX/ui-craft-and-visual-qa/scripts/taste-check.cjs
          design-system/starter/desktop.html
          --width 1024 --width 1280 --width 1440 --height 900 --layout strict
      - name: Pattern gallery passes the taste check
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: >-
          node skills_UIUX/ui-craft-and-visual-qa/scripts/taste-check.cjs
          design-system/patterns/index.html
          --width 320 --width 390 --width 768 --width 1280 --width 1440
      - name: Starter mobile screens pass the strict layout check
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: >-
          node skills_UIUX/ui-craft-and-visual-qa/scripts/taste-check.cjs
          design-system/starter/mobile.html --width 390 --layout strict design-system/starter/mobile-ios.html design-system/starter/mobile-android.html
      - name: Starter web pages reflow at 320 px
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: >-
          node skills_UIUX/ui-craft-and-visual-qa/scripts/taste-check.cjs
          design-system/starter/web.html design-system/starter/web-states.html design-system/starter/landing.html
          --width 1280 --theme light --reflow
      - name: Trial example (gom-moc) passes the taste check
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: >-
          node skills_UIUX/ui-craft-and-visual-qa/scripts/taste-check.cjs
          design-system/examples/gom-moc/landing.html design-system/examples/gom-moc/app.html
      - name: Upload starter kit screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: starter-kit-screenshots
          path: ${{ runner.temp }}/starter-shots
          if-no-files-found: ignore
