name: P1.7.10 Continuous Provider Truth

on:
  pull_request:
    paths:
      - ".github/workflows/p1710-continuous-provider-truth.yml"
      - "uiux-factory/core/runtime/flow_os/continuous_provider_truth.py"
      - "uiux-factory/core/dogfood/p1710_continuous_provider_truth.py"
      - "uiux-factory/core/dogfood/p177_multi_provider_attestation_truth.py"
      - "uiux-factory/tests/test_p1710_continuous_provider_truth.py"
      - "uiux-factory/tests/test_p1710_workflow_boundary.py"
      - "skills_UIUX/scripts/run-p1710-continuous-provider-truth.py"
      - "uiux-factory/docs/architecture/CURRENT-RUNTIME-MAP.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p1710-continuous-provider-truth.yml"
      - "uiux-factory/core/runtime/flow_os/continuous_provider_truth.py"
      - "uiux-factory/core/dogfood/p1710_continuous_provider_truth.py"
      - "uiux-factory/core/dogfood/p177_multi_provider_attestation_truth.py"
      - "uiux-factory/tests/test_p1710_continuous_provider_truth.py"
      - "uiux-factory/tests/test_p1710_workflow_boundary.py"
      - "skills_UIUX/scripts/run-p1710-continuous-provider-truth.py"
      - "uiux-factory/docs/architecture/CURRENT-RUNTIME-MAP.md"
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest "pydantic>=2.5.3,<3" "python-dotenv>=1,<2"
      - name: Compile P1.7.10 runtime
        run: >-
          python -m py_compile
          uiux-factory/core/runtime/flow_os/continuous_provider_truth.py
          uiux-factory/core/dogfood/p1710_continuous_provider_truth.py
          skills_UIUX/scripts/run-p1710-continuous-provider-truth.py
      - name: Run P1.7.10 plus provider-truth regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/uiux-factory
        run: >-
          python -m pytest -q
          uiux-factory/tests/test_p1710_continuous_provider_truth.py
          uiux-factory/tests/test_p1710_workflow_boundary.py
          uiux-factory/tests/test_p179_railway_provider_attestation.py
          uiux-factory/tests/test_p178_provider_attestation_coverage.py
          uiux-factory/tests/test_p177_multi_provider_attestation.py
          uiux-factory/tests/test_p177_workflow_boundary.py
          uiux-factory/tests/test_p176_provider_attestation_truth.py

  matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repositories: ${{ steps.matrix.outputs.repositories }}
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build continuous provider truth matrix
        id: matrix
        env:
          PYTHONPATH: ${{ github.workspace }}/uiux-factory
        shell: bash
        run: |
          repositories="$(python skills_UIUX/scripts/run-p1710-continuous-provider-truth.py --matrix)"
          echo "repositories=${repositories}" >> "$GITHUB_OUTPUT"

  monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.repositories) }}
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          path: factory
          persist-credentials: false
      - name: Checkout target repository read-only
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          path: target
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run credential-aware continuous provider truth
        env:
          PYTHONPATH: ${{ github.workspace }}/factory/uiux-factory
          P1710_GITHUB_TOKEN: ${{ github.token }}
          P177_VERCEL_TOKEN: ${{ secrets.P177_VERCEL_TOKEN }}
          P177_VERCEL_TEAM_ID: ${{ secrets.P177_VERCEL_TEAM_ID }}
          P177_NETLIFY_TOKEN: ${{ secrets.P177_NETLIFY_TOKEN }}
          P177_RENDER_TOKEN: ${{ secrets.P177_RENDER_TOKEN }}
          P177_CLOUDFLARE_API_TOKEN: ${{ secrets.P177_CLOUDFLARE_API_TOKEN }}
          P177_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.P177_CLOUDFLARE_ACCOUNT_ID }}
          P179_RAILWAY_TOKEN: ${{ secrets.P179_RAILWAY_TOKEN }}
          P179_RAILWAY_WORKSPACE_ID: ${{ secrets.P179_RAILWAY_WORKSPACE_ID }}
        run: >-
          python factory/skills_UIUX/scripts/run-p1710-continuous-provider-truth.py
          --repository "${{ matrix.repository }}"
          --repo-root target
          --output-dir "${{ runner.temp }}/p1710/${{ matrix.slug }}"
          --max-age-days 90
      - name: Upload continuous provider truth evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1710-continuous-provider-truth-${{ matrix.slug }}
          path: ${{ runner.temp }}/p1710/${{ matrix.slug }}/*.json
          if-no-files-found: error
