name: P1.7.10 Continuous Provider Truth

on:
  pull_request:
    paths:
      - ".github/workflows/p1710-continuous-provider-truth.yml"
      - "uiux-factory/core/runtime/flow_os/continuous_provider_truth.py"
      - "uiux-factory/core/dogfood/p1710_continuous_provider_truth.py"
      - "uiux-factory/core/dogfood/p177_multi_provider_attestation_truth.py"
      - "uiux-factory/tests/test_p1710_continuous_provider_truth.py"
      - "uiux-factory/tests/test_p1710_workflow_boundary.py"
      - "skills_UIUX/scripts/run-p1710-continuous-provider-truth.py"
      - "uiux-factory/core/runtime/flow_os/provider_truth_fleet.py"
      - "uiux-factory/tests/test_p1711_provider_truth_fleet.py"
      - "uiux-factory/tests/test_p1711_workflow_boundary.py"
      - "skills_UIUX/scripts/run-p1711-provider-truth-fleet-summary.py"
      - "uiux-factory/core/runtime/flow_os/provider_truth_transition.py"
      - "uiux-factory/core/runtime/flow_os/provider_truth_history.py"
      - "uiux-factory/tests/test_p1712_provider_truth_transition.py"
      - "uiux-factory/tests/test_p1712_provider_truth_history.py"
      - "uiux-factory/tests/test_p1712_workflow_boundary.py"
      - "skills_UIUX/scripts/fetch-p1712-provider-truth-baseline.py"
      - "skills_UIUX/scripts/run-p1712-provider-truth-transition.py"
      - "uiux-factory/docs/architecture/CURRENT-RUNTIME-MAP.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p1710-continuous-provider-truth.yml"
      - "uiux-factory/core/runtime/flow_os/continuous_provider_truth.py"
      - "uiux-factory/core/dogfood/p1710_continuous_provider_truth.py"
      - "uiux-factory/core/dogfood/p177_multi_provider_attestation_truth.py"
      - "uiux-factory/tests/test_p1710_continuous_provider_truth.py"
      - "uiux-factory/tests/test_p1710_workflow_boundary.py"
      - "skills_UIUX/scripts/run-p1710-continuous-provider-truth.py"
      - "uiux-factory/core/runtime/flow_os/provider_truth_fleet.py"
      - "uiux-factory/tests/test_p1711_provider_truth_fleet.py"
      - "uiux-factory/tests/test_p1711_workflow_boundary.py"
      - "skills_UIUX/scripts/run-p1711-provider-truth-fleet-summary.py"
      - "uiux-factory/core/runtime/flow_os/provider_truth_transition.py"
      - "uiux-factory/core/runtime/flow_os/provider_truth_history.py"
      - "uiux-factory/tests/test_p1712_provider_truth_transition.py"
      - "uiux-factory/tests/test_p1712_provider_truth_history.py"
      - "uiux-factory/tests/test_p1712_workflow_boundary.py"
      - "skills_UIUX/scripts/fetch-p1712-provider-truth-baseline.py"
      - "skills_UIUX/scripts/run-p1712-provider-truth-transition.py"
      - "uiux-factory/docs/architecture/CURRENT-RUNTIME-MAP.md"
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest "pydantic>=2.5.3,<3" "python-dotenv>=1,<2"
      - name: Compile P1.7.10 runtime
        run: >-
          python -m py_compile
          uiux-factory/core/runtime/flow_os/continuous_provider_truth.py
          uiux-factory/core/dogfood/p1710_continuous_provider_truth.py
          skills_UIUX/scripts/run-p1710-continuous-provider-truth.py
          uiux-factory/core/runtime/flow_os/provider_truth_transition.py
          uiux-factory/core/runtime/flow_os/provider_truth_history.py
          skills_UIUX/scripts/fetch-p1712-provider-truth-baseline.py
          skills_UIUX/scripts/run-p1712-provider-truth-transition.py
      - name: Run P1.7.10 plus provider-truth regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/uiux-factory
        run: >-
          python -m pytest -q
          uiux-factory/tests/test_p1710_continuous_provider_truth.py
          uiux-factory/tests/test_p1710_workflow_boundary.py
          uiux-factory/tests/test_p1711_provider_truth_fleet.py
          uiux-factory/tests/test_p1711_workflow_boundary.py
          uiux-factory/tests/test_p1712_provider_truth_transition.py
          uiux-factory/tests/test_p1712_provider_truth_history.py
          uiux-factory/tests/test_p1712_workflow_boundary.py
          uiux-factory/tests/test_p179_railway_provider_attestation.py
          uiux-factory/tests/test_p178_provider_attestation_coverage.py
          uiux-factory/tests/test_p177_multi_provider_attestation.py
          uiux-factory/tests/test_p177_workflow_boundary.py
          uiux-factory/tests/test_p176_provider_attestation_truth.py

  matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repositories: ${{ steps.matrix.outputs.repositories }}
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build continuous provider truth matrix
        id: matrix
        env:
          PYTHONPATH: ${{ github.workspace }}/uiux-factory
        shell: bash
        run: |
          repositories="$(python skills_UIUX/scripts/run-p1710-continuous-provider-truth.py --matrix)"
          echo "repositories=${repositories}" >> "$GITHUB_OUTPUT"

  monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.repositories) }}
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          path: factory
          persist-credentials: false
      - name: Checkout target repository read-only
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          path: target
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run credential-aware continuous provider truth
        env:
          PYTHONPATH: ${{ github.workspace }}/factory/uiux-factory
          P1710_GITHUB_TOKEN: ${{ github.token }}
          P177_VERCEL_TOKEN: ${{ secrets.P177_VERCEL_TOKEN }}
          P177_VERCEL_TEAM_ID: ${{ secrets.P177_VERCEL_TEAM_ID }}
          P177_NETLIFY_TOKEN: ${{ secrets.P177_NETLIFY_TOKEN }}
          P177_RENDER_TOKEN: ${{ secrets.P177_RENDER_TOKEN }}
          P177_CLOUDFLARE_API_TOKEN: ${{ secrets.P177_CLOUDFLARE_API_TOKEN }}
          P177_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.P177_CLOUDFLARE_ACCOUNT_ID }}
          P179_RAILWAY_TOKEN: ${{ secrets.P179_RAILWAY_TOKEN }}
          P179_RAILWAY_WORKSPACE_ID: ${{ secrets.P179_RAILWAY_WORKSPACE_ID }}
        run: >-
          python factory/skills_UIUX/scripts/run-p1710-continuous-provider-truth.py
          --repository "${{ matrix.repository }}"
          --repo-root target
          --output-dir "${{ runner.temp }}/p1710/${{ matrix.slug }}"
          --max-age-days 90
      - name: Upload continuous provider truth evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1710-continuous-provider-truth-${{ matrix.slug }}
          path: ${{ runner.temp }}/p1710/${{ matrix.slug }}/*.json
          if-no-files-found: error

  fleet-summary:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [matrix, monitor]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download repository provider truth artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: p1710-continuous-provider-truth-*
          path: ${{ runner.temp }}/p1711/repositories
          merge-multiple: false
      - name: Aggregate fleet provider truth
        env:
          PYTHONPATH: ${{ github.workspace }}/uiux-factory
        run: >-
          python skills_UIUX/scripts/run-p1711-provider-truth-fleet-summary.py
          --input-dir "${{ runner.temp }}/p1711/repositories"
          --output "${{ runner.temp }}/p1711/provider-truth-fleet-summary.json"
      - name: Upload fleet provider truth summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1711-provider-truth-fleet-summary
          path: ${{ runner.temp }}/p1711/provider-truth-fleet-summary.json
          if-no-files-found: error

  provider-truth-transition:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [fleet-summary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download current fleet summary
        uses: actions/download-artifact@v6
        with:
          name: p1711-provider-truth-fleet-summary
          path: ${{ runner.temp }}/p1712/current
      - name: Fetch previous fleet summary baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python skills_UIUX/scripts/fetch-p1712-provider-truth-baseline.py
          --repository "${{ github.repository }}"
          --workflow-file "p1710-continuous-provider-truth.yml"
          --current-run-id "${{ github.run_id }}"
          --baseline-output "${{ runner.temp }}/p1712/baseline/provider-truth-fleet-summary.json"
          --selection-output "${{ runner.temp }}/p1712/evidence/baseline-selection.json"
      - name: Build historical provider truth transition
        env:
          PYTHONPATH: ${{ github.workspace }}/uiux-factory
        run: >-
          python skills_UIUX/scripts/run-p1712-provider-truth-transition.py
          --current "${{ runner.temp }}/p1712/current/provider-truth-fleet-summary.json"
          --baseline "${{ runner.temp }}/p1712/baseline/provider-truth-fleet-summary.json"
          --baseline-selection "${{ runner.temp }}/p1712/evidence/baseline-selection.json"
          --output "${{ runner.temp }}/p1712/evidence/provider-truth-transition.json"
      - name: Upload provider truth transition artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p1712-provider-truth-transition
          path: ${{ runner.temp }}/p1712/evidence/*.json
          if-no-files-found: error
