name: Design System Browser Review

# Kiểm tra token và CSS nằm ở job release-candidate trong checks.yml.
# Workflow này chỉ chụp và soát design system trên ba trình duyệt khi design-system/ thay đổi.

on:
  push:
    paths:
      - "design-system/**"
      - ".github/workflows/design-system.yml"
  pull_request:
    paths:
      - "design-system/**"
      - ".github/workflows/design-system.yml"

permissions:
  contents: read

jobs:
  browser-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright and axe-core outside the repo
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1 axe-core@4
          npx playwright install --with-deps chromium webkit firefox
      - name: Browser gate failure regressions
        run: node --test design-system/tests/browser-gate.test.cjs
      - name: Browser checks in three engines
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: node design-system/scripts/capture-example.cjs "$RUNNER_TEMP/ds-review"
      - name: Money app checks in three engines
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: node design-system/scripts/capture-money-app.cjs "$RUNNER_TEMP/ds-review/money-app"
      - name: Surface browser gate failures as annotations
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/ds-review/browser-report.json" "$RUNNER_TEMP/ds-review/money-app/browser-report.json"; do
            [ -f "$f" ] && node -e 'const r=require(process.argv[1]); if (r.status!=="PASS") console.log("::error title=Browser gate " + r.status + "::" + String(r.error||"no error recorded").slice(0,1800).replace(/\n/g," "))' "$f"
          done
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-system-review
          path: ${{ runner.temp }}/ds-review
