name: P1.4 Multi-Intent Surface Routing

on:
  pull_request:
    paths:
      - "uiux-factory/core/dogfood/multi_surface_matrix.py"
      - "uiux-factory/core/orchestration/intelligent_flow.py"
      - "uiux-factory/core/runtime/flow_os/sequence_flow.py"
      - "uiux-factory/core/runtime/flow_os/sequence_router.py"
      - "uiux-factory/core/runtime/flow_os/work_sequence.py"
      - "uiux-factory/scripts/run_p14_multi_surface_routing.py"
      - "uiux-factory/tests/test_p14_multi_intent_surface_routing.py"
      - ".github/workflows/p14-multi-intent-surface-routing.yml"
      - ".github/workflows/routing-intelligence-contract.yml"
      - "skills_UIUX/runtime/P14-MULTI-INTENT-SURFACE-ROUTING.md"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/uiux-factory
  REPORT_ROOT: ${{ github.workspace }}/p14-artifacts

jobs:
  p14-multi-intent-surface-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "pydantic>=2.5.3,<3"

      - name: Run P1.4 sequence contract tests
        working-directory: uiux-factory
        run: python -m pytest -q tests/test_p14_multi_intent_surface_routing.py

      - name: Produce P1.4 routing evidence
        working-directory: uiux-factory
        run: >-
          python scripts/run_p14_multi_surface_routing.py
          --report "$REPORT_ROOT/multi-intent-surface-routing.json"

      - name: Upload P1.4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p14-multi-intent-surface-routing-${{ github.run_id }}
          path: p14-artifacts/*.json
          if-no-files-found: warn
