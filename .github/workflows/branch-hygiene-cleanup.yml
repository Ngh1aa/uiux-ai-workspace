name: Branch Hygiene Cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/branch-hygiene-cleanup.yml"
      - "docs/branch-hygiene-cleanup.json"
      - "skills_UIUX/scripts/branch-hygiene-cleanup.py"
      - "uiux-factory/core/runtime/flow_os/branch_hygiene.py"
      - "uiux-factory/tests/test_branch_hygiene.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-hygiene-cleanup.yml"
      - "docs/branch-hygiene-cleanup.json"
      - "skills_UIUX/scripts/branch-hygiene-cleanup.py"
      - "uiux-factory/core/runtime/flow_os/branch_hygiene.py"
      - "uiux-factory/tests/test_branch_hygiene.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run branch hygiene contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/uiux-factory
        run: python -m pytest -q uiux-factory/tests/test_branch_hygiene.py
      - name: Dry-run audited branch cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python skills_UIUX/scripts/branch-hygiene-cleanup.py
          --repository "${{ github.repository }}"
          --manifest docs/branch-hygiene-cleanup.json
          --output "${{ runner.temp }}/branch-hygiene-dry-run.json"
      - name: Upload dry-run evidence
        uses: actions/upload-artifact@v6
        with:
          name: branch-hygiene-dry-run
          path: ${{ runner.temp }}/branch-hygiene-dry-run.json
          if-no-files-found: error

  cleanup:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Delete only audited zero-ahead stale branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python skills_UIUX/scripts/branch-hygiene-cleanup.py
          --repository "${{ github.repository }}"
          --manifest docs/branch-hygiene-cleanup.json
          --apply
          --output "${{ runner.temp }}/branch-hygiene-applied.json"
      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: branch-hygiene-applied
          path: ${{ runner.temp }}/branch-hygiene-applied.json
          if-no-files-found: error
