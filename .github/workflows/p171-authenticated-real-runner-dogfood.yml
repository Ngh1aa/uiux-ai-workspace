name: P1.7.1 Authenticated Real Runner Dogfood

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: p171-authenticated-real-runner-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authenticated-dogfood:
    if: startsWith(github.event.issue.title, '[P1.7.1 DOGFOOD]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Authorize trusted issue author from live GitHub state
        id: authorize
        uses: actions/github-script@v8
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const issuer = issue.user?.login || 'unknown';
            const association = issue.author_association || 'NONE';
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            let repoPermission = 'none';
            let roleName = 'none';
            if (issuer !== 'unknown') {
              try {
                const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: issuer,
                });
                repoPermission = permission.permission || 'none';
                roleName = permission.role_name || repoPermission;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const trustedByAssociation = trustedAssociations.has(association);
            const trustedByPermission = repoPermission === 'admin' || repoPermission === 'write';
            const authorizationBasis = trustedByAssociation
              ? `author_association:${association}`
              : (trustedByPermission ? `repo_permission:${repoPermission}` : 'none');

            core.info(`P1.7.1 issuer: ${issuer}`);
            core.info(`Live author_association: ${association}`);
            core.info(`Effective repository permission: ${repoPermission} (${roleName})`);
            core.info(`Authorization basis: ${authorizationBasis}`);

            if (!trustedByAssociation && !trustedByPermission) {
              core.setFailed(`P1.7.1 request rejected: association=${association}, repo_permission=${repoPermission}`);
              return;
            }

            core.setOutput('issuer', issuer);
            core.setOutput('association', association);
            core.setOutput('repo_permission', repoPermission);
            core.setOutput('authorization_basis', authorizationBasis);

      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Factory runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pydantic>=2.5.3,<3" "python-dotenv>=1,<2"

      - name: Authenticated target-repository preflight
        env:
          GH_TOKEN: ${{ secrets.UIUX_TARGET_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTH_BLOCKED: repository secret UIUX_TARGET_REPO_TOKEN is not configured"
            exit 78
          fi
          PUSH_ALLOWED="$(gh api repos/Ngh1aa/LuxRoom --jq '.permissions.push')"
          if [ "$PUSH_ALLOWED" != "true" ]; then
            echo "::error::AUTH_BLOCKED: UIUX_TARGET_REPO_TOKEN does not have push access to Ngh1aa/LuxRoom"
            exit 77
          fi
          gh auth setup-git

      - name: Run authenticated GitHubProductionRunner dogfood
        id: dogfood
        env:
          UIUX_TARGET_REPO_TOKEN: ${{ secrets.UIUX_TARGET_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.UIUX_TARGET_REPO_TOKEN }}
        run: |
          TRANSACTION_ID="p171-issue-${{ github.event.issue.number }}-luxroom-cart-total-live-region"
          python -B skills_UIUX/scripts/run-p171-authenticated-real-dogfood.py \
            --profile luxroom-cart-total-live-region \
            --transaction-id "$TRANSACTION_ID" \
            --workspace-root "$RUNNER_TEMP/p171-transactions" \
            --output-dir "$GITHUB_WORKSPACE/p171-artifacts" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload P1.7.1 authenticated evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p171-authenticated-real-runner-${{ github.event.issue.number }}
          path: p171-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Comment successful PR-only handoff
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `P1.7.1 authenticated real-runner dogfood completed.\n\n- Target: \`Ngh1aa/LuxRoom\`\n- Transaction branch: \`${{ steps.dogfood.outputs.transaction_branch }}\`\n- PR: ${{ steps.dogfood.outputs.pr_url }}\n- PR state: \`${{ steps.dogfood.outputs.pr_state }}\`\n- main unchanged: \`${{ steps.dogfood.outputs.main_unchanged }}\`\n- Authorized issuer: \`${{ steps.authorize.outputs.issuer }}\` via \`${{ steps.authorize.outputs.authorization_basis }}\`\n- Merge/deploy: **not performed**\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Comment fail-closed result
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `P1.7.1 authenticated dogfood failed closed. No merge or deployment is authorized by this workflow. Check the run for authorization, AUTH_BLOCKED, transaction, QA, or PR evidence.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
