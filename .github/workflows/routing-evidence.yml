permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/uiux-factory

jobs:
  routing-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install targeted test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest "pydantic>=2.5.3,<3"

      - name: Run routing and external-collaborator regression tests
        run: >-
          python -m pytest -q
          uiux-factory/tests/test_routing_intelligence_bridge_a39.py
          uiux-factory/tests/test_routing_intelligence_regression.py
          uiux-factory/tests/test_external_collaborator_a21.py
          uiux-factory/tests/test_task_contract.py
          uiux-factory/tests/test_intelligent_flow.py
          uiux-factory/tests/test_canonical_specialist_routing_p11.py
          uiux-factory/tests/test_p11_archetype_real_task_dogfood.py
          uiux-factory/tests/test_p12_mixed_domain_stress.py
          uiux-factory/tests/test_p13_ambiguous_routing.py
          uiux-factory/tests/test_p14_multi_intent_surface_routing.py
          uiux-factory/tests/test_p15_stateful_work_plan_execution.py
          uiux-factory/tests/test_p16_execution_driver.py
          uiux-factory/tests/test_p17_github_production_transaction.py
          uiux-factory/tests/test_p171_authenticated_real_runner.py
          uiux-factory/tests/test_visual_signature_contract.py
          uiux-factory/tests/test_github_external_agent_runner_a33.py

  phase-evidence:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: p12-mixed-domain-stress
            test: tests/test_p12_mixed_domain_stress.py
            script: scripts/run_p12_mixed_domain_stress.py
            report: mixed-domain.json
          - id: p13-ambiguous-routing-evidence
            test: tests/test_p13_ambiguous_routing.py
            script: scripts/run_p13_ambiguous_routing.py
            report: ambiguous-routing.json
          - id: p14-multi-intent-surface-routing
            test: tests/test_p14_multi_intent_surface_routing.py
            script: scripts/run_p14_multi_surface_routing.py
            report: multi-intent-surface-routing.json
          - id: p15-stateful-work-plan-execution
            test: tests/test_p15_stateful_work_plan_execution.py
            script: scripts/run_p15_stateful_execution.py
            report: stateful-work-plan-execution.json
          - id: p16-execution-driver
            test: tests/test_p16_execution_driver.py
            script: scripts/run_p16_execution_driver.py
            report: execution-driver.json
          - id: p17-github-production-transaction
            test: tests/test_p17_github_production_transaction.py
            script: scripts/run_p17_github_transaction.py
            report: github-production-transaction.json
    env:
      REPORT_ROOT: ${{ github.workspace }}/${{ matrix.id }}-artifacts
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        working-directory: uiux-factory
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "pydantic>=2.5.3,<3"

      - name: Run contract tests
        working-directory: uiux-factory
        run: python -m pytest -q ${{ matrix.test }}

      - name: Produce evidence report
        if: always()
        working-directory: uiux-factory
        run: python ${{ matrix.script }} --report "$REPORT_ROOT/${{ matrix.report }}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ matrix.id }}-artifacts/*.json
