name: A14 Fix Once Validate Across Projects

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/a14-fix-once-validate-across-projects.yml"
      - "docs/VISUAL-SIGNATURE-REGRESSION-CONTRACT.md"
      - "docs/CONTRACT-OWNERSHIP.md"
      - "PROJECT-CONTEXT.template.md"
      - "uiux-factory/core/dogfood/**"
      - "uiux-factory/core/runtime/flow_os/**"
      - "uiux-factory/scripts/run_cross_project_dogfood.py"
      - "uiux-factory/tests/test_cross_project_dogfood_a13.py"
      - "uiux-factory/tests/test_fix_once_a14.py"
      - "uiux-factory/tests/test_generic_real_project_a14.py"
      - "uiux-factory/tests/test_visual_signature_contract.py"
      - "skills_UIUX/flows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/a14-fix-once-validate-across-projects.yml"
      - "docs/VISUAL-SIGNATURE-REGRESSION-CONTRACT.md"
      - "docs/CONTRACT-OWNERSHIP.md"
      - "PROJECT-CONTEXT.template.md"
      - "uiux-factory/core/dogfood/**"
      - "uiux-factory/core/runtime/flow_os/**"
      - "uiux-factory/scripts/run_cross_project_dogfood.py"
      - "uiux-factory/tests/test_cross_project_dogfood_a13.py"
      - "uiux-factory/tests/test_fix_once_a14.py"
      - "uiux-factory/tests/test_generic_real_project_a14.py"
      - "uiux-factory/tests/test_visual_signature_contract.py"
      - "skills_UIUX/flows/**"

permissions:
  contents: read

jobs:
  factory-regressions:
    name: Factory regression contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Factory test dependencies
        working-directory: uiux-factory
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run A14 focused regressions
        working-directory: uiux-factory
        run: |
          python -m pytest -q \
            tests/test_adaptive_flow.py \
            tests/test_cross_project_dogfood_a13.py \
            tests/test_fix_once_a14.py \
            tests/test_generic_real_project_a14.py \
            tests/test_visual_signature_contract.py

  golden-regression:
    name: Golden / ${{ matrix.project_id }}
    needs: factory-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - project_id: nova
            repository: Ngh1aa/Nova
            golden_sha: e206f51f2fda006adcf52497d8b827e048e157ec
          - project_id: lumen
            repository: Ngh1aa/Lumen
            golden_sha: 219f3e49f9956290ef69a2e49cb91fefddd5f561
          - project_id: cennext
            repository: Ngh1aa/cennext-b2b-prototype
            golden_sha: 273403accf8979608fbb16dbe2741cedb0430fb6
          - project_id: luxroom
            repository: Ngh1aa/LuxRoom
            golden_sha: 6ee5e8b9b7a671f33ad20493c436085bb287e3ca
    env:
      TARGET_ROOT: ${{ github.workspace }}/.dogfood/golden/${{ matrix.project_id }}
      REPORT_ROOT: ${{ github.workspace }}/a14-artifacts/golden
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout pinned golden target
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.golden_sha }}
          path: .dogfood/golden/${{ matrix.project_id }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Factory test dependencies
        working-directory: uiux-factory
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate pinned golden project
        working-directory: uiux-factory
        run: |
          python scripts/run_cross_project_dogfood.py \
            --project-id "${{ matrix.project_id }}" \
            --project-root "$TARGET_ROOT" \
            --expected-target-sha "${{ matrix.golden_sha }}" \
            --report "$REPORT_ROOT/${{ matrix.project_id }}.json"

      - name: Upload golden report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a14-golden-${{ matrix.project_id }}-${{ github.run_id }}
          if-no-files-found: warn
          path: a14-artifacts/golden/${{ matrix.project_id }}.json

  current-head-canary:
    name: Canary / ${{ matrix.project_id }}@main
    needs: factory-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - project_id: nova
            repository: Ngh1aa/Nova
          - project_id: lumen
            repository: Ngh1aa/Lumen
          - project_id: cennext
            repository: Ngh1aa/cennext-b2b-prototype
          - project_id: luxroom
            repository: Ngh1aa/LuxRoom
    env:
      TARGET_ROOT: ${{ github.workspace }}/.dogfood/canary/${{ matrix.project_id }}
      REPORT_ROOT: ${{ github.workspace }}/a14-artifacts/canary
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout current target main
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: main
          path: .dogfood/canary/${{ matrix.project_id }}

      - name: Bind canary to checked-out head
        id: target
        shell: bash
        run: |
          sha="$(git -C "$TARGET_ROOT" rev-parse HEAD)"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Canary target: ${{ matrix.repository }}@$sha"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Factory test dependencies
        working-directory: uiux-factory
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate current-head canary
        working-directory: uiux-factory
        run: |
          python scripts/run_cross_project_dogfood.py \
            --project-id "${{ matrix.project_id }}" \
            --project-root "$TARGET_ROOT" \
            --expected-target-sha "${{ steps.target.outputs.sha }}" \
            --report "$REPORT_ROOT/${{ matrix.project_id }}.json"

      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a14-canary-${{ matrix.project_id }}-${{ github.run_id }}
          if-no-files-found: warn
          path: a14-artifacts/canary/${{ matrix.project_id }}.json
