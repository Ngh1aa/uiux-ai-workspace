name: A13 Dogfood

# Consolidates the former A13 cross-project and Nova real-project dogfood workflows.
# Job names are unchanged.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/a13-dogfood.yml"
      - "skills_UIUX/**"
      - "skills_UIUX/runtime/A13-CROSS-PROJECT-DOGFOOD.md"
      - "uiux-factory/core/dogfood/**"
      - "uiux-factory/core/dogfood/cross_project.py"
      - "uiux-factory/core/runtime/flow_os/**"
      - "uiux-factory/qa/**"
      - "uiux-factory/scripts/run_cross_project_dogfood.py"
      - "uiux-factory/scripts/run_nova_dogfood.py"
      - "uiux-factory/tests/test_cross_project_dogfood_a13.py"
      - "uiux-factory/tests/test_nova_dogfood_a13.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/a13-dogfood.yml"
      - "skills_UIUX/**"
      - "skills_UIUX/runtime/A13-CROSS-PROJECT-DOGFOOD.md"
      - "uiux-factory/core/dogfood/**"
      - "uiux-factory/core/dogfood/cross_project.py"
      - "uiux-factory/core/runtime/flow_os/**"
      - "uiux-factory/qa/**"
      - "uiux-factory/scripts/run_cross_project_dogfood.py"
      - "uiux-factory/scripts/run_nova_dogfood.py"
      - "uiux-factory/tests/test_cross_project_dogfood_a13.py"
      - "uiux-factory/tests/test_nova_dogfood_a13.py"

permissions:
  contents: read

jobs:
  cross-project-dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LUMEN_SHA: 219f3e49f9956290ef69a2e49cb91fefddd5f561
      CENNEXT_SHA: 384cb62fa5c880cc3ef3e596c45b85d46df2e04d
      LUMEN_ROOT: ${{ github.workspace }}/.dogfood/Lumen
      CENNEXT_ROOT: ${{ github.workspace }}/.dogfood/CENNEXT
      REPORT_ROOT: ${{ github.workspace }}/a13-artifacts/cross-project

    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout pinned Lumen
        uses: actions/checkout@v6
        with:
          repository: Ngh1aa/Lumen
          ref: 219f3e49f9956290ef69a2e49cb91fefddd5f561
          path: .dogfood/Lumen

      - name: Checkout pinned CENNEXT
        uses: actions/checkout@v6
        with:
          repository: Ngh1aa/cennext-b2b-prototype
          ref: 384cb62fa5c880cc3ef3e596c45b85d46df2e04d
          path: .dogfood/CENNEXT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run focused regression tests
        working-directory: uiux-factory
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.5.3,<3" "python-dotenv>=1,<2" -r requirements-dev.txt
          python -m pytest -q tests/test_cross_project_dogfood_a13.py

      - name: Dogfood real Lumen checkout
        working-directory: uiux-factory
        run: |
          python scripts/run_cross_project_dogfood.py \
            --project-id lumen \
            --project-root "$LUMEN_ROOT" \
            --expected-target-sha "$LUMEN_SHA" \
            --report "$REPORT_ROOT/lumen.json"

      - name: Dogfood real CENNEXT checkout
        working-directory: uiux-factory
        run: |
          python scripts/run_cross_project_dogfood.py \
            --project-id cennext \
            --project-root "$CENNEXT_ROOT" \
            --expected-target-sha "$CENNEXT_SHA" \
            --report "$REPORT_ROOT/cennext.json"

      - name: Upload cross-project reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a13-cross-project-dogfood-${{ github.run_id }}
          if-no-files-found: warn
          path: a13-artifacts/cross-project/*.json

  nova-dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOVA_SHA: b4cc64906b3f5739005f5d80f7ac9e6dc5e6ad10
      NOVA_ROOT: ${{ github.workspace }}/.dogfood/Nova
      A13_REPORT: ${{ github.workspace }}/a13-artifacts/nova-dogfood.json

    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout pinned Nova
        uses: actions/checkout@v6
        with:
          repository: Ngh1aa/Nova
          ref: b4cc64906b3f5739005f5d80f7ac9e6dc5e6ad10
          path: .dogfood/Nova

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Factory dependencies
        working-directory: uiux-factory
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.5.3,<3" "python-dotenv>=1,<2" -r requirements-dev.txt

      - name: Install canonical browser QA dependencies
        working-directory: uiux-factory/qa
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start pinned Nova static server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory "$NOVA_ROOT" > /tmp/a13-nova-server.log 2>&1 &
          echo $! > /tmp/a13-nova-server.pid
          python - <<'PY'
          import time
          import urllib.request
          url = "http://127.0.0.1:4173/app.html?screen=home"
          error = None
          for _ in range(50):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          print(f"Nova server ready: {url}")
                          raise SystemExit(0)
              except Exception as exc:
                  error = exc
                  time.sleep(0.2)
          raise SystemExit(f"Nova server did not become ready: {error}")
          PY

      - name: Run A13 against real Nova
        working-directory: uiux-factory
        run: |
          python scripts/run_nova_dogfood.py \
            --project-root "$NOVA_ROOT" \
            --base-url http://127.0.0.1:4173 \
            --expected-target-sha "$NOVA_SHA" \
            --report "$A13_REPORT"

      - name: Upload dogfood evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a13-nova-dogfood-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            a13-artifacts/nova-dogfood.json
            uiux-factory/qa/artifacts/a13-nova-*/**

      - name: Stop Nova server
        if: always()
        run: |
          if [ -f /tmp/a13-nova-server.pid ]; then
            kill "$(cat /tmp/a13-nova-server.pid)" 2>/dev/null || true
          fi
          cat /tmp/a13-nova-server.log 2>/dev/null || true

