name: P1.7.2 External Side-Effect Live Dogfood

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: p172-external-side-effect-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  p172-live-dogfood:
    if: startsWith(github.event.issue.title, '[P1.7.2 DOGFOOD]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authorize trusted issue author from live GitHub state
        id: authorize
        uses: actions/github-script@v8
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const issuer = issue.user?.login || 'unknown';
            const association = issue.author_association || 'NONE';
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            let repoPermission = 'none';
            if (issuer !== 'unknown') {
              try {
                const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: issuer,
                });
                repoPermission = permission.permission || 'none';
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (!trustedAssociations.has(association) && repoPermission !== 'admin' && repoPermission !== 'write') {
              core.setFailed(`P1.7.2 request rejected: association=${association}, repo_permission=${repoPermission}`);
              return;
            }
            core.setOutput('issuer', issuer);
            core.setOutput('authorization_basis', trustedAssociations.has(association) ? `author_association:${association}` : `repo_permission:${repoPermission}`);

      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Factory runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pydantic>=2.5.3,<3" "python-dotenv>=1,<2"

      - name: Read-only credential preflight
        env:
          GH_TOKEN: ${{ secrets.UIUX_TARGET_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTH_BLOCKED: repository secret UIUX_TARGET_REPO_TOKEN is not configured"
            exit 78
          fi
          gh api repos/Ngh1aa/LuxRoom >/dev/null
          gh api repos/Ngh1aa/LuxRoom/pulls/24 >/dev/null

      - name: Observe LuxRoom PR #24 and evaluate both policies
        env:
          UIUX_TARGET_REPO_TOKEN: ${{ secrets.UIUX_TARGET_REPO_TOKEN }}
        run: >-
          python -B skills_UIUX/scripts/run-p172-external-side-effect-governance.py
          --repository Ngh1aa/LuxRoom
          --pr-number 24
          --base-branch main
          --output-dir "$GITHUB_WORKSPACE/p172-artifacts"

      - name: Upload P1.7.2 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p172-external-side-effect-${{ github.event.issue.number }}
          path: p172-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Comment successful read-only governance result
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `P1.7.2 live side-effect governance passed.\n\n- Target evidence: \`Ngh1aa/LuxRoom#24\`\n- \`pr-preview-allowed\`: Vercel preview observed and permitted\n- \`zero-deploy-strict\`: blocked before any target mutation\n- Target mutation / merge / deployment by this workflow: **not performed**\n- Authorized issuer: \`${{ steps.authorize.outputs.issuer }}\` via \`${{ steps.authorize.outputs.authorization_basis }}\`\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Comment fail-closed result
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `P1.7.2 live governance failed closed. No target mutation, merge, or deployment is authorized by this workflow.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
