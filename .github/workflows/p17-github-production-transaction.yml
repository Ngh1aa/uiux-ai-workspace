name: P1.7 GitHub Production Transaction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "uiux-factory/core/orchestration/intelligent_flow.py"
      - "uiux-factory/core/runtime/flow_os/execution_driver.py"
      - "uiux-factory/core/runtime/flow_os/github_transaction.py"
      - "uiux-factory/scripts/run_p17_github_transaction.py"
      - "uiux-factory/tests/fixtures/p17_github_worker.py"
      - "uiux-factory/tests/test_p17_github_production_transaction.py"
      - ".github/workflows/p17-github-production-transaction.yml"
      - ".github/workflows/routing-intelligence-contract.yml"
  push:
    branches: [main]
    paths:
      - "uiux-factory/core/orchestration/intelligent_flow.py"
      - "uiux-factory/core/runtime/flow_os/execution_driver.py"
      - "uiux-factory/core/runtime/flow_os/github_transaction.py"
      - "uiux-factory/scripts/run_p17_github_transaction.py"
      - "uiux-factory/tests/fixtures/p17_github_worker.py"
      - "uiux-factory/tests/test_p17_github_production_transaction.py"
      - ".github/workflows/p17-github-production-transaction.yml"
      - ".github/workflows/routing-intelligence-contract.yml"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/uiux-factory
  REPORT_ROOT: ${{ github.workspace }}/p17-artifacts

jobs:
  p17-github-production-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        working-directory: uiux-factory
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "pydantic>=2.5.3,<3"

      - name: Run P1.7 production transaction tests
        working-directory: uiux-factory
        run: python -m pytest -q tests/test_p17_github_production_transaction.py

      - name: Produce P1.7 GitHub transaction evidence
        if: always()
        working-directory: uiux-factory
        run: >-
          python scripts/run_p17_github_transaction.py
          --report "$REPORT_ROOT/github-production-transaction.json"

      - name: Upload P1.7 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p17-github-production-transaction-${{ github.run_id }}
          path: p17-artifacts/*.json
          if-no-files-found: warn
