name: Benchmark recheck (tạm)

# Workflow tạm để soát lại các bài benchmark đã đóng băng bằng taste-check mới,
# rồi commit kết quả JSON vào benchmarks/evidence/2026-10-30/. Gỡ trước khi merge. (lần 2)

on:
  push:
    branches: [claude/cham-lai-benchmark-gu-moi]
    paths: [.github/workflows/benchmark-recheck.yml]

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright Chromium outside the repo
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1 axe-core@4
          npx playwright install --with-deps chromium
      - name: Run taste-check on frozen benchmark pages
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          out=benchmarks/evidence/2026-10-30/render
          mkdir -p "$out"
          for run in 2026-10-29-fresh 2026-10-29-iterative-repair; do
            for brief in 01-landing 02-app 03-dashboard 04-multi-role 05-native; do
              strict=""; [ "$brief" = "04-multi-role" ] && strict="--layout strict"
              node skills_UIUX/ui-craft-and-visual-qa/scripts/taste-check.cjs \
                "benchmarks/runs/$run/$brief/index.html" --root . --locale vi-VN \
                --width 390 --width 1280 --height 900 --theme light $strict \
                --json "$out/$run--$brief.json" > /dev/null || true
            done
          done
          ls -la "$out"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/evidence/2026-10-30/render
          git commit -m "Kết quả taste-check mới trên benchmark đóng băng" || exit 0
          git push
