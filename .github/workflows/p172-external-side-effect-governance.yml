name: P1.7.2 External Side-Effect Governance

on:
  pull_request:
    paths:
      - "uiux-factory/core/runtime/flow_os/external_side_effects.py"
      - "uiux-factory/core/runtime/flow_os/repository_policy_registry.py"
      - "uiux-factory/core/runtime/flow_os/__init__.py"
      - "uiux-factory/core/dogfood/p171_authenticated_real_runner.py"
      - "uiux-factory/core/dogfood/p172_external_side_effect_governance.py"
      - "uiux-factory/core/dogfood/p173_repository_policy_registry.py"
      - "skills_UIUX/scripts/run-p172-external-side-effect-governance.py"
      - "skills_UIUX/scripts/run-p173-repository-policy-registry.py"
      - "skills_UIUX/runtime/P172-EXTERNAL-SIDE-EFFECT-GOVERNANCE.md"
      - "skills_UIUX/runtime/P173-REPOSITORY-POLICY-REGISTRY.md"
      - "uiux-factory/tests/test_p172_external_side_effect_governance.py"
      - "uiux-factory/tests/test_p172_live_workflow_boundary.py"
      - "uiux-factory/tests/test_p173_repository_policy_registry.py"
      - "uiux-factory/tests/test_p173_live_workflow_boundary.py"
      - "uiux-factory/tests/test_p171_authenticated_real_runner.py"
      - ".github/workflows/p172-external-side-effect-governance.yml"
      - ".github/workflows/p172-external-side-effect-live-dogfood.yml"
      - ".github/workflows/p173-repository-policy-registry.yml"
      - ".github/workflows/p173-repository-policy-live-dogfood.yml"
      - ".github/workflows/p171-authenticated-real-runner-contract.yml"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/uiux-factory

jobs:
  p172-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest "pydantic>=2.5.3,<3"
      - name: Run P1.7.2 governance contract
        run: >-
          python -m pytest -q
          uiux-factory/tests/test_p172_external_side_effect_governance.py
          uiux-factory/tests/test_p172_live_workflow_boundary.py
          uiux-factory/tests/test_p173_repository_policy_registry.py
          uiux-factory/tests/test_p173_live_workflow_boundary.py
          uiux-factory/tests/test_p171_authenticated_real_runner.py
          uiux-factory/tests/test_p17_github_production_transaction.py
