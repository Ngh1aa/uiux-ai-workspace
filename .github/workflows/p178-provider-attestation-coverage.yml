name: P1.7.8 Provider Attestation Coverage

on:
  pull_request:
    paths:
      - ".github/workflows/p178-provider-attestation-coverage.yml"
      - "uiux-factory/core/runtime/flow_os/provider_attestation.py"
      - "uiux-factory/core/runtime/flow_os/__init__.py"
      - "uiux-factory/core/dogfood/p177_multi_provider_attestation_truth.py"
      - "uiux-factory/tests/test_p178_provider_attestation_coverage.py"
      - "uiux-factory/tests/test_p177_multi_provider_attestation.py"
      - "uiux-factory/docs/architecture/CURRENT-RUNTIME-MAP.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p178-provider-attestation-coverage.yml"
      - "uiux-factory/core/runtime/flow_os/provider_attestation.py"
      - "uiux-factory/core/runtime/flow_os/__init__.py"
      - "uiux-factory/core/dogfood/p177_multi_provider_attestation_truth.py"
      - "uiux-factory/tests/test_p178_provider_attestation_coverage.py"
      - "uiux-factory/tests/test_p177_multi_provider_attestation.py"
      - "uiux-factory/docs/architecture/CURRENT-RUNTIME-MAP.md"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest "pydantic>=2.5.3,<3" "python-dotenv>=1,<2"
      - name: Compile P1.7.8 coverage contract
        run: >-
          python -m py_compile
          uiux-factory/core/runtime/flow_os/provider_attestation.py
          uiux-factory/core/dogfood/p177_multi_provider_attestation_truth.py
      - name: Run P1.7.8 plus provider-truth regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/uiux-factory
        run: >-
          python -m pytest -q
          uiux-factory/tests/test_p178_provider_attestation_coverage.py
          uiux-factory/tests/test_p177_multi_provider_attestation.py
          uiux-factory/tests/test_p177_workflow_boundary.py
          uiux-factory/tests/test_p176_provider_attestation_truth.py
          uiux-factory/tests/test_p176_workflow_boundary.py
