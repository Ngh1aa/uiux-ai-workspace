name: Routing Intelligence Contract

on:
  pull_request:
    paths:
      - "uiux-factory/core/dogfood/archetype_matrix.py"
      - "uiux-factory/core/dogfood/mixed_domain_matrix.py"
      - "uiux-factory/core/runtime/flow_os/external_task.py"
      - "uiux-factory/core/runtime/flow_os/flow.py"
      - "uiux-factory/core/runtime/flow_os/specialist_composition.py"
      - "uiux-factory/core/runtime/flow_os/specialist_taxonomy.py"
      - "uiux-factory/core/runtime/flow_os/task_context.py"
      - "skills_UIUX/scripts/github-connector-task-request.py"
      - ".github/workflows/external-agent-connector-bridge.yml"
      - ".github/workflows/routing-intelligence-contract.yml"
      - ".github/workflows/p12-mixed-domain-stress.yml"
      - "uiux-factory/tests/test_routing_intelligence_bridge_a39.py"
      - "uiux-factory/tests/test_intelligent_flow.py"
      - "uiux-factory/tests/test_canonical_specialist_routing_p11.py"
      - "uiux-factory/tests/test_p11_archetype_real_task_dogfood.py"
      - "uiux-factory/tests/test_p12_mixed_domain_stress.py"
      - "docs/CONTRACT-OWNERSHIP.md"
      - "START-HERE.md"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/uiux-factory

jobs:
  routing-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install targeted test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest "pydantic>=2.5.3,<3"

      - name: Run routing and external-collaborator regression tests
        run: >-
          python -m pytest -q
          uiux-factory/tests/test_routing_intelligence_bridge_a39.py
          uiux-factory/tests/test_external_collaborator_a21.py
          uiux-factory/tests/test_task_contract.py
          uiux-factory/tests/test_intelligent_flow.py
          uiux-factory/tests/test_canonical_specialist_routing_p11.py
          uiux-factory/tests/test_p11_archetype_real_task_dogfood.py
          uiux-factory/tests/test_p12_mixed_domain_stress.py
          uiux-factory/tests/test_visual_signature_contract.py
          uiux-factory/tests/test_github_external_agent_runner_a33.py
