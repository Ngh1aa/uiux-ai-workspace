name: Routing Intelligence Contract

on:
  pull_request:
    paths:
      - "uiux-factory/core/dogfood/archetype_matrix.py"
      - "uiux-factory/core/dogfood/mixed_domain_matrix.py"
      - "uiux-factory/core/dogfood/ambiguous_domain_matrix.py"
      - "uiux-factory/core/dogfood/multi_surface_matrix.py"
      - "uiux-factory/core/dogfood/p171_authenticated_real_runner.py"
      - "uiux-factory/core/runtime/flow_os/external_task.py"
      - "uiux-factory/core/runtime/flow_os/flow.py"
      - "uiux-factory/core/runtime/flow_os/sequence_flow.py"
      - "uiux-factory/core/runtime/flow_os/sequence_router.py"
      - "uiux-factory/core/runtime/flow_os/work_sequence.py"
      - "uiux-factory/core/runtime/flow_os/work_execution.py"
      - "uiux-factory/core/runtime/flow_os/execution_driver.py"
      - "uiux-factory/core/runtime/flow_os/github_transaction.py"
      - "uiux-factory/core/runtime/flow_os/specialist_composition.py"
      - "uiux-factory/core/runtime/flow_os/specialist_taxonomy.py"
      - "uiux-factory/core/runtime/flow_os/task_context.py"
      - "skills_UIUX/runtime/specialist-composition.json"
      - "skills_UIUX/flows/audit-review.json"
      - "skills_UIUX/flows/existing-ui-improvement.json"
      - "skills_UIUX/flows/page-ui-work.json"
      - "skills_UIUX/flows/professional-website-redesign.json"
      - "uiux-factory/core/orchestration/intelligent_flow.py"
      - "uiux-factory/scripts/run_p17_github_transaction.py"
      - "skills_UIUX/scripts/github-connector-task-request.py"
      - "skills_UIUX/scripts/p171-authenticated-real-runner-worker.py"
      - "skills_UIUX/scripts/run-p171-authenticated-real-dogfood.py"
      - ".github/workflows/external-agent-connector-bridge.yml"
      - ".github/workflows/routing-intelligence-contract.yml"
      - ".github/workflows/p12-mixed-domain-stress.yml"
      - ".github/workflows/p13-ambiguous-routing-evidence.yml"
      - ".github/workflows/p14-multi-intent-surface-routing.yml"
      - ".github/workflows/p15-stateful-work-plan-execution.yml"
      - ".github/workflows/p16-execution-driver.yml"
      - ".github/workflows/p17-github-production-transaction.yml"
      - ".github/workflows/p171-authenticated-real-runner-contract.yml"
      - ".github/workflows/p171-authenticated-real-runner-dogfood.yml"
      - "uiux-factory/tests/test_routing_intelligence_bridge_a39.py"
      - "uiux-factory/tests/test_routing_intelligence_regression.py"
      - "uiux-factory/tests/test_intelligent_flow.py"
      - "uiux-factory/tests/test_canonical_specialist_routing_p11.py"
      - "uiux-factory/tests/test_p11_archetype_real_task_dogfood.py"
      - "uiux-factory/tests/test_p12_mixed_domain_stress.py"
      - "uiux-factory/tests/test_p13_ambiguous_routing.py"
      - "uiux-factory/tests/test_p14_multi_intent_surface_routing.py"
      - "uiux-factory/tests/test_p15_stateful_work_plan_execution.py"
      - "uiux-factory/tests/test_p16_execution_driver.py"
      - "uiux-factory/tests/test_p17_github_production_transaction.py"
      - "uiux-factory/tests/test_p171_authenticated_real_runner.py"
      - "docs/CONTRACT-OWNERSHIP.md"
      - "START-HERE.md"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/uiux-factory

jobs:
  routing-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install targeted test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest "pydantic>=2.5.3,<3"

      - name: Run routing and external-collaborator regression tests
        run: >-
          python -m pytest -q
          uiux-factory/tests/test_routing_intelligence_bridge_a39.py
          uiux-factory/tests/test_routing_intelligence_regression.py
          uiux-factory/tests/test_external_collaborator_a21.py
          uiux-factory/tests/test_task_contract.py
          uiux-factory/tests/test_intelligent_flow.py
          uiux-factory/tests/test_canonical_specialist_routing_p11.py
          uiux-factory/tests/test_p11_archetype_real_task_dogfood.py
          uiux-factory/tests/test_p12_mixed_domain_stress.py
          uiux-factory/tests/test_p13_ambiguous_routing.py
          uiux-factory/tests/test_p14_multi_intent_surface_routing.py
          uiux-factory/tests/test_p15_stateful_work_plan_execution.py
          uiux-factory/tests/test_p16_execution_driver.py
          uiux-factory/tests/test_p17_github_production_transaction.py
          uiux-factory/tests/test_p171_authenticated_real_runner.py
          uiux-factory/tests/test_visual_signature_contract.py
          uiux-factory/tests/test_github_external_agent_runner_a33.py
