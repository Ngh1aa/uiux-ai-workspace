name: P1.3 Ambiguous Routing Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/p13-ambiguous-routing-evidence.yml"
      - ".github/workflows/routing-intelligence-contract.yml"
      - "uiux-factory/core/dogfood/ambiguous_domain_matrix.py"
      - "uiux-factory/core/orchestration/intelligent_flow.py"
      - "uiux-factory/core/runtime/flow_os/flow.py"
      - "uiux-factory/core/runtime/flow_os/specialist_taxonomy.py"
      - "uiux-factory/core/runtime/flow_os/task_context.py"
      - "uiux-factory/scripts/run_p13_ambiguous_routing.py"
      - "uiux-factory/tests/test_p13_ambiguous_routing.py"
      - "skills_UIUX/runtime/P13-AMBIGUOUS-ROUTING-EVIDENCE.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p13-ambiguous-routing-evidence.yml"
      - ".github/workflows/routing-intelligence-contract.yml"
      - "uiux-factory/core/dogfood/ambiguous_domain_matrix.py"
      - "uiux-factory/core/orchestration/intelligent_flow.py"
      - "uiux-factory/core/runtime/flow_os/flow.py"
      - "uiux-factory/core/runtime/flow_os/specialist_taxonomy.py"
      - "uiux-factory/core/runtime/flow_os/task_context.py"
      - "uiux-factory/scripts/run_p13_ambiguous_routing.py"
      - "uiux-factory/tests/test_p13_ambiguous_routing.py"
      - "skills_UIUX/runtime/P13-AMBIGUOUS-ROUTING-EVIDENCE.md"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/uiux-factory

jobs:
  p13-ambiguous-routing-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPORT_ROOT: ${{ github.workspace }}/p13-artifacts

    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        working-directory: uiux-factory
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "pydantic>=2.5.3,<3"

      - name: Run P1.3 ambiguity contract tests
        working-directory: uiux-factory
        run: python -m pytest -q tests/test_p13_ambiguous_routing.py

      - name: Produce P1.3 routing evidence
        if: always()
        working-directory: uiux-factory
        run: |
          python scripts/run_p13_ambiguous_routing.py \
            --report "$REPORT_ROOT/ambiguous-routing.json"

      - name: Upload P1.3 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p13-ambiguous-routing-${{ github.run_id }}
          if-no-files-found: warn
          path: p13-artifacts/*.json
