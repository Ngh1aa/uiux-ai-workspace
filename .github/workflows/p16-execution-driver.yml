name: P1.6 Execution Driver Real Runner

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "uiux-factory/core/orchestration/intelligent_flow.py"
      - "uiux-factory/core/runtime/flow_os/execution_driver.py"
      - "uiux-factory/core/runtime/flow_os/work_execution.py"
      - "uiux-factory/scripts/run_p16_execution_driver.py"
      - "uiux-factory/tests/test_p16_execution_driver.py"
      - "uiux-factory/tests/fixtures/p16_segment_runner.py"
      - ".github/workflows/p16-execution-driver.yml"
      - ".github/workflows/routing-intelligence-contract.yml"
      - "skills_UIUX/runtime/P16-EXECUTION-DRIVER.md"
  push:
    branches: [main]
    paths:
      - "uiux-factory/core/orchestration/intelligent_flow.py"
      - "uiux-factory/core/runtime/flow_os/execution_driver.py"
      - "uiux-factory/core/runtime/flow_os/work_execution.py"
      - "uiux-factory/scripts/run_p16_execution_driver.py"
      - "uiux-factory/tests/test_p16_execution_driver.py"
      - "uiux-factory/tests/fixtures/p16_segment_runner.py"
      - ".github/workflows/p16-execution-driver.yml"
      - ".github/workflows/routing-intelligence-contract.yml"
      - "skills_UIUX/runtime/P16-EXECUTION-DRIVER.md"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/uiux-factory
  REPORT_ROOT: ${{ github.workspace }}/p16-artifacts

jobs:
  p16-execution-driver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        working-directory: uiux-factory
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "pydantic>=2.5.3,<3"

      - name: Run P1.6 execution driver tests
        working-directory: uiux-factory
        run: python -m pytest -q tests/test_p16_execution_driver.py

      - name: Produce P1.6 driver evidence
        if: always()
        working-directory: uiux-factory
        run: >-
          python scripts/run_p16_execution_driver.py
          --report "$REPORT_ROOT/execution-driver.json"

      - name: Upload P1.6 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p16-execution-driver-${{ github.run_id }}
          path: p16-artifacts/*.json
          if-no-files-found: warn
