name: UIUX Factory CI

on:
  push:
    paths:
      - "uiux-factory/**"
      - "skills_UIUX/**"
      - ".gitmodules"
      - ".github/workflows/uiux-factory-ci.yml"
  pull_request:
    paths:
      - "uiux-factory/**"
      - "skills_UIUX/**"
      - ".gitmodules"
      - ".github/workflows/uiux-factory-ci.yml"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uiux-factory

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.5.3,<3" "python-dotenv>=1,<2" -r requirements-dev.txt

      - name: Verify pinned Anthropic skills
        run: python scripts/verify_anthropic_skills.py

      - name: Compile Python source tree
        run: python -m compileall -q core apps run.py

      - name: Check Workbench JavaScript syntax
        run: |
          node --check apps/web/app.js
          node --check apps/web/skills-router.js

      - name: Run foundation tests
        run: python -m pytest -q tests
