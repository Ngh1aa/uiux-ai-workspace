name: UIUX Factory CI

on:
  push:
    paths:
      - "uiux-factory/**"
      - "skills_UIUX/**"
      - "START-HERE.md"
      - "AGENTS.md"
      - "docs/CONTRACT-OWNERSHIP.md"
      - "docs/STATE-COVERAGE-INFRASTRUCTURE.md"
      - "docs/DEPLOYMENT-TRUTH.md"
      - "docs/EVIDENCE-REGISTRY.md"
      - "docs/A37-REAL-PROJECT-E2E-DOGFOOD.md"
      - ".gitmodules"
      - ".github/workflows/uiux-factory-ci.yml"
      - ".github/workflows/external-task-manifest.yml"
      - ".github/workflows/external-agent-runner.yml"
      - ".github/workflows/deployment-truth-gate.yml"
      - ".github/workflows/a37-external-agent-e2e-dogfood.yml"
  pull_request:
    paths:
      - "uiux-factory/**"
      - "skills_UIUX/**"
      - "START-HERE.md"
      - "AGENTS.md"
      - "docs/CONTRACT-OWNERSHIP.md"
      - "docs/STATE-COVERAGE-INFRASTRUCTURE.md"
      - "docs/DEPLOYMENT-TRUTH.md"
      - "docs/EVIDENCE-REGISTRY.md"
      - "docs/A37-REAL-PROJECT-E2E-DOGFOOD.md"
      - ".gitmodules"
      - ".github/workflows/uiux-factory-ci.yml"
      - ".github/workflows/external-task-manifest.yml"
      - ".github/workflows/external-agent-runner.yml"
      - ".github/workflows/deployment-truth-gate.yml"
      - ".github/workflows/a37-external-agent-e2e-dogfood.yml"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uiux-factory
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.5.3,<3" "python-dotenv>=1,<2" -r requirements-dev.txt
      - name: Verify pinned Anthropic skills
        run: python scripts/verify_anthropic_skills.py
      - name: Verify pinned Motion Primitives corpus
        run: python scripts/verify_motion_primitives.py
      - name: Compile active Python source tree
        run: |
          python -m compileall -q core run.py creator.py apps/bridge/creative_review.py
          python -m compileall -q scripts/validate_provider_default_migration_readiness.py scripts/run_provider_live_trial.py scripts/validate_lifecycle_mutation_convergence_readiness.py scripts/validate_lifecycle_event_interop.py
          python -m compileall -q ../skills_UIUX/runtime ../skills_UIUX/scripts/prepare-external-task.py ../skills_UIUX/scripts/github-external-agent-runner.py ../skills_UIUX/scripts/build-release-evidence.py
      - name: Validate Flow Agent OS contracts
        run: |
          python ../skills_UIUX/scripts/validate-flows.py
          python ../skills_UIUX/scripts/validate-runtime-foundation.py
      - name: Validate active benchmark corpus
        run: |
          python scripts/validate_benchmark_corpus.py
          python scripts/validate_routing_benchmark.py
          python scripts/validate_repair_proposal_benchmark.py
          python scripts/validate_memory_boundary_benchmark.py
          python scripts/validate_scorecard_benchmark.py
          python scripts/validate_provider_parity_benchmark.py
          python scripts/validate_provider_default_migration_readiness.py
          python scripts/validate_lifecycle_parity_benchmark.py
          python scripts/validate_lifecycle_mutation_convergence_readiness.py
          python scripts/validate_lifecycle_event_interop.py
          python scripts/validate_knowledge_retrieval_benchmark.py
          python scripts/validate_knowledge_project_dogfood.py
          python scripts/validate_knowledge_value_trial.py
          python scripts/validate_knowledge_edtech_canonical_apply.py
          python scripts/validate_knowledge_genai_nist_freshness_review.py
      # Historical A50 validators remain immutable governance evidence. Active CI
      # validates current five-record Knowledge OS truth, the GenAI freshness HOLD,
      # A51.1 provider readiness, A52.1 mutation readiness and A52.2 event interop.
      - name: Run foundation tests
        run: python -m pytest -q tests
