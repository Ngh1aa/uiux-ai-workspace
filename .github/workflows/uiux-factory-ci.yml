name: UIUX Factory CI

on:
  push:
    paths:
      - "uiux-factory/**"
      - ".github/workflows/uiux-factory-ci.yml"
  pull_request:
    paths:
      - "uiux-factory/**"
      - ".github/workflows/uiux-factory-ci.yml"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uiux-factory

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.5.3,<3" "python-dotenv>=1,<2" -r requirements-dev.txt

      - name: Compile source tree
        run: python -m compileall -q core apps run.py

      - name: Run foundation tests
        run: python -m pytest -q tests
