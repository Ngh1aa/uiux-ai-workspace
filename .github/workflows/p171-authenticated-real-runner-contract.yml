name: P1.7.1 Authenticated Real Runner Contract

on:
  pull_request:
    paths:
      - "uiux-factory/core/dogfood/p171_authenticated_real_runner.py"
      - "skills_UIUX/scripts/p171-authenticated-real-runner-worker.py"
      - "skills_UIUX/scripts/run-p171-authenticated-real-dogfood.py"
      - "uiux-factory/tests/test_p171_authenticated_real_runner.py"
      - ".github/workflows/p171-authenticated-real-runner-dogfood.yml"
      - ".github/workflows/p171-authenticated-real-runner-contract.yml"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/uiux-factory

jobs:
  p171-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest "pydantic>=2.5.3,<3"
      - name: Run P1.7.1 authenticated boundary tests
        run: python -m pytest -q uiux-factory/tests/test_p171_authenticated_real_runner.py uiux-factory/tests/test_p17_github_production_transaction.py
