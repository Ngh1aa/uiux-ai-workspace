<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ví dụ Sai và Đúng</title>
<link rel="stylesheet" href="../../design-system/fonts/fonts.css">
<style>
  :root {
    --page: #eef0f4; --surface: #ffffff; --ink: #141a2b; --ink-2: #4a5268; --line: #dde1ea;
    --brand: #1f3a8a; --brand-card: #2c4aa3; --brand-tint: #e6ebf8; --alert: #b42318; --alert-tint: #fde8e6;
    --bad: #b42318; --good: #136c3a;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.6 "Be Vietnam Pro", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; }
  .pair { margin: 0 0 56px; }
  .pair > h2 { margin: 0 0 16px; font-size: 22px; line-height: 1.3; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  figure { margin: 0; }
  figcaption { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  figcaption b { display: inline-block; margin-right: 6px; padding: 0 10px; border-radius: 999px; color: #fff; }
  .bad figcaption b { background: var(--bad); } .good figcaption b { background: var(--good); }
  .phone { width: 360px; max-width: 100%; margin: 0 auto; padding: 20px 16px; border-radius: 28px; background: var(--page); border: 1px solid var(--line); }
  .card { background: var(--surface); border-radius: var(--r); padding: 16px; }
  .stack { display: grid; gap: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .muted { color: var(--ink-2); }
  .t-label { font-size: 13px; color: var(--ink-2); }
  .t-num { font-size: 22px; font-weight: 700; line-height: 1.2; }
  h3 { margin: 0; font-size: 17px; line-height: 1.35; }
  p { margin: 0; }
  .hl { background: var(--brand); color: #fff; border-radius: var(--r); padding: 18px; display: grid; gap: 4px; }
  .hl .big { font-size: 44px; font-weight: 700; line-height: 1.1; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; font: 600 15px/1 "Be Vietnam Pro", sans-serif; }
  .btn-white { background: #fff; color: var(--brand); justify-self: start; margin-top: 10px; }
  .btn-primary { background: var(--brand); color: #fff; width: 100%; }
  .btn-ghost { background: var(--surface); color: var(--brand); width: 100%; border: 1px solid var(--line); }
  .rows { padding: 0 16px; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .val { font-weight: 600; }
  .chev { color: var(--ink-2); font-size: 18px; }
  .avatar { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--brand-tint); color: var(--brand); font-weight: 700; font-size: 14px; }
  .chip { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #eef0f4; color: var(--ink-2); }
  .chip-brand { background: var(--brand-tint); color: var(--brand); }
  .chip-alert { background: var(--alert-tint); color: var(--alert); }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .field { display: flex; align-items: center; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .nav { display: flex; gap: 4px; padding: 8px; border-radius: 999px; background: var(--brand); }
  .nav span { flex: 1; display: grid; place-items: center; min-height: 48px; border-radius: 999px; color: rgba(255,255,255,.75); }
  .nav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; }
  .nav .on { flex: 2.2; display: flex; gap: 8px; background: #fff; color: var(--brand); font-weight: 600; }
  .center { text-align: center; }
  .ok-icon { display: grid; place-items: center; width: 64px; height: 64px; margin: 8px auto 0; border-radius: 50%; background: var(--brand-tint); color: var(--brand); }
  .ok-icon svg { width: 32px; height: 32px; stroke: currentColor; fill: none; }
  .kv { background: var(--brand-card); color: #fff; border-radius: var(--r); padding: 0 16px; }
  .kv .row { border-color: rgba(255,255,255,.18); min-height: 48px; }
  .kv .row .grow { color: rgba(255,255,255,.8); }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1 data-annotation style="margin:0 0 32px;font-size:28px;line-height:1.25">Ví dụ Sai và Đúng</h1>

  <!-- A -->
  <section class="pair" id="a" data-pair="a">
    <h2 data-annotation>A. Một điểm nhìn</h2>
    <div class="cols">
      <figure class="bad"><figcaption data-annotation><b>Sai</b>Sáu card cùng cỡ, mỗi card một màu: không biết nhìn đâu</figcaption>
        <div class="phone"><div class="grid2">
          <div class="card" style="background:#e6ebf8"><p class="t-label">Học sinh</p><p class="t-num">128</p></div>
          <div class="card" style="background:#e3f4ea"><p class="t-label">Lớp</p><p class="t-num">24</p></div>
          <div class="card" style="background:#fdf1dc"><p class="t-label">Chờ duyệt</p><p class="t-num">5</p></div>
          <div class="card" style="background:#fde8e6"><p class="t-label">Chưa thu</p><p class="t-num">12</p></div>
          <div class="card" style="background:#efe6fb"><p class="t-label">Buổi hôm nay</p><p class="t-num">18</p></div>
          <div class="card" style="background:#e1f3f7"><p class="t-label">Tin nhắn</p><p class="t-num">3</p></div>
        </div></div>
      </figure>
      <figure class="good"><figcaption data-annotation><b>Đúng</b>Một card nổi bật ba tầng, nút trắng; phần còn lại lùi về một danh sách</figcaption>
        <div class="phone"><div class="stack">
          <div class="hl"><p>Chờ duyệt</p><p class="big">5 đơn</p><p>3 chuyển lịch, 2 nghỉ học</p><button class="btn btn-white" type="button">Duyệt đơn</button></div>
          <div class="card rows">
            <div class="row"><span class="grow">Buổi hôm nay</span><span class="val">18</span><span class="chev">›</span></div>
            <div class="row"><span class="grow">Học phí chưa thu</span><span class="val">12</span><span class="chev">›</span></div>
            <div class="row"><span class="grow">Học sinh đang học</span><span class="val">128</span><span class="chev">›</span></div>
          </div>
        </div></div>
      </figure>
    </div>
  </section>

  <!-- B -->
  <section class="pair" id="b" data-pair="b">
    <h2 data-annotation>B. Gần nhau thì là một nhóm</h2>
    <div class="cols">
      <figure class="bad"><figcaption data-annotation><b>Sai</b>Nhãn cách đều ô trên và ô dưới, hai nhóm dính nhau</figcaption>
        <div class="phone"><div style="display:grid;gap:14px">
          <label>Mã học sinh</label><div class="field">HS0412</div>
          <label>Môn</label><div class="field">Toán</div>
          <label>Giáo viên</label><div class="field">Cô Thu Hà</div>
          <label>Ngày bắt đầu</label><div class="field">Thứ Hai 3/11</div>
        </div></div>
      </figure>
      <figure class="good"><figcaption data-annotation><b>Đúng</b>Nhãn sát ô, giữa nhóm gấp đôi trong nhóm</figcaption>
        <div class="phone"><div style="display:grid;gap:28px">
          <div style="display:grid;gap:16px">
            <div style="display:grid;gap:6px"><label>Mã học sinh</label><div class="field">HS0412</div></div>
            <div style="display:grid;gap:6px"><label>Môn</label><div class="field">Toán</div></div>
          </div>
          <div style="display:grid;gap:16px">
            <div style="display:grid;gap:6px"><label>Giáo viên</label><div class="field">Cô Thu Hà</div></div>
            <div style="display:grid;gap:6px"><label>Ngày bắt đầu</label><div class="field">Thứ Hai 3/11</div></div>
          </div>
        </div></div>
      </figure>
    </div>
  </section>

  <!-- C -->
  <section class="pair" id="c" data-pair="c">
    <h2 data-annotation>C. Chữ tiếng Việt cần khoảng dòng</h2>
    <div class="cols">
      <figure class="bad"><figcaption data-annotation><b>Sai</b>Khoảng dòng 1,2 và tiêu đề IN HOA: dấu chồng chạm dòng trên</figcaption>
        <div class="phone"><div class="card stack">
          <h3 style="text-transform:uppercase;line-height:1.1;font-size:20px">Nguyễn Thị Hường, lớp Tiếng Việt nâng cao</h3>
          <p style="line-height:1.2">Thứ Bảy này trường tổ chức ngày hội đọc sách. Phụ huynh đăng ký tham gia trước thứ Năm để nhà trường chuẩn bị chỗ ngồi.</p>
        </div></div>
      </figure>
      <figure class="good"><figcaption data-annotation><b>Đúng</b>Thân 1,6, tiêu đề chữ thường 1,3</figcaption>
        <div class="phone"><div class="card stack">
          <h3 style="line-height:1.3;font-size:20px">Nguyễn Thị Hường, lớp Tiếng Việt nâng cao</h3>
          <p style="line-height:1.6">Thứ Bảy này trường tổ chức ngày hội đọc sách. Phụ huynh đăng ký tham gia trước thứ Năm để nhà trường chuẩn bị chỗ ngồi.</p>
        </div></div>
      </figure>
    </div>
  </section>

  <!-- D -->
  <section class="pair" id="d" data-pair="d">
    <h2 data-annotation>D. Khoảng trắng bị động</h2>
    <div class="cols">
      <figure class="bad"><figcaption data-annotation><b>Sai</b>Card cao chỉ một dòng ở đầu; card danh sách có đệm trên dưới gấp đôi</figcaption>
        <div class="phone"><div class="stack">
          <div class="card" style="height:150px"><h3>Lịch dạy hôm nay</h3></div>
          <div class="card" style="padding:32px 16px"><div class="rows" style="padding:0">
            <div class="row"><span class="grow">Toán 9A</span><span class="val">8:00</span></div>
            <div class="row"><span class="grow">Toán 8B</span><span class="val">14:00</span></div>
          </div></div>
        </div></div>
      </figure>
      <figure class="good"><figcaption data-annotation><b>Đúng</b>Card ôm nội dung; dòng đầu và cuối sát đệm thường của card</figcaption>
        <div class="phone"><div class="stack">
          <h3>Lịch dạy hôm nay</h3>
          <div class="card rows">
            <div class="row"><span class="grow">Toán 9A</span><span class="val">8:00</span></div>
            <div class="row"><span class="grow">Toán 8B</span><span class="val">14:00</span></div>
          </div>
        </div></div>
      </figure>
    </div>
  </section>

  <!-- E -->
  <section class="pair" id="e" data-pair="e">
    <h2 data-annotation>E. Không dòng giải thích phụ</h2>
    <div class="cols">
      <figure class="bad"><figcaption data-annotation><b>Sai</b>Ghi chú thời điểm cập nhật, hướng dẫn bấm, chú giải</figcaption>
        <div class="phone"><div class="card stack">
          <h3>Học phí tháng 10</h3>
          <p class="t-label">Cập nhật lúc 7:45. Bấm vào thẻ để xem chi tiết từng học sinh.</p>
          <p class="t-num">12 học sinh chưa đóng</p>
          <p class="t-label">● Chưa đóng ● Đã đóng một phần</p>
        </div></div>
      </figure>
      <figure class="good"><figcaption data-annotation><b>Đúng</b>Chỉ tiêu đề và dữ liệu; cả thẻ bấm được, có chevron</figcaption>
        <div class="phone"><div class="card" style="display:flex;align-items:center;gap:12px">
          <div style="flex:1;display:grid;gap:2px"><h3>Học phí tháng 10</h3><p class="t-num">12 học sinh chưa đóng</p></div>
          <span class="chev">›</span>
        </div></div>
      </figure>
    </div>
  </section>

  <!-- F -->
  <section class="pair" id="f" data-pair="f">
    <h2 data-annotation>F. Trạng thái bằng chữ, không bằng thanh màu trái</h2>
    <div class="cols">
      <figure class="bad"><figcaption data-annotation><b>Sai</b>Thanh màu bên trái, phải đoán nghĩa từng màu</figcaption>
        <div class="phone"><div class="stack">
          <div class="card" style="border-left:5px solid #b42318"><h3>Trần Gia Hân</h3><p class="t-label">HS0412</p></div>
          <div class="card" style="border-left:5px solid #d97706"><h3>Lê Minh Khoa</h3><p class="t-label">HS0398</p></div>
          <div class="card" style="border-left:5px solid #136c3a"><h3>Phạm Thu An</h3><p class="t-label">HS0377</p></div>
        </div></div>
      </figure>
      <figure class="good"><figcaption data-annotation><b>Đúng</b>Avatar, tên, mã cùng nhau; trạng thái là chip có chữ</figcaption>
        <div class="phone"><div class="card rows">
          <div class="row"><span class="avatar">GH</span><span class="grow"><b>Trần Gia Hân</b><br><span class="t-label">HS0412</span></span><span class="chip chip-alert">Nghỉ 3 buổi</span></div>
          <div class="row"><span class="avatar">MK</span><span class="grow"><b>Lê Minh Khoa</b><br><span class="t-label">HS0398</span></span><span class="chip">Chờ xếp lớp</span></div>
          <div class="row"><span class="avatar">TA</span><span class="grow"><b>Phạm Thu An</b><br><span class="t-label">HS0377</span></span><span class="chip chip-brand">Đang học</span></div>
        </div></div>
      </figure>
    </div>
  </section>

  <!-- G -->
  <section class="pair" id="g" data-pair="g">
    <h2 data-annotation>G. Thanh điều hướng dạng viên</h2>
    <div class="cols">
      <figure class="bad"><figcaption data-annotation><b>Sai</b>Nhãn ở mọi tab, chữ 11 px, tab chọn chỉ đổi màu chữ</figcaption>
        <div class="phone"><div style="display:flex;justify-content:space-around;padding:8px 0;border-radius:16px;background:#fff">
          <span style="display:grid;justify-items:center;font-size:11px;color:var(--brand);font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Tổng quan</span>
          <span style="display:grid;justify-items:center;font-size:11px;color:var(--ink-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Học sinh</span>
          <span style="display:grid;justify-items:center;font-size:11px;color:var(--ink-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Lịch</span>
          <span style="display:grid;justify-items:center;font-size:11px;color:var(--ink-2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 5h16v11H8l-4 4z"/></svg>Tin nhắn</span>
        </div></div>
      </figure>
      <figure class="good"><figcaption data-annotation><b>Đúng</b>Tab chọn nở thành viên icon và nhãn, tab khác chỉ icon, viên không chạm mép</figcaption>
        <div class="phone"><nav class="nav" aria-label="Điều hướng chính">
          <span class="on"><svg viewBox="0 0 24 24" stroke-width="1.75"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Tổng quan</span>
          <span><svg viewBox="0 0 24 24" stroke-width="1.75"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></span>
          <span><svg viewBox="0 0 24 24" stroke-width="1.75"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span>
          <span><svg viewBox="0 0 24 24" stroke-width="1.75"><path d="M4 5h16v11H8l-4 4z"/></svg></span>
        </nav></div>
      </figure>
    </div>
  </section>

  <!-- H -->
  <section class="pair" id="h" data-pair="h">
    <h2 data-annotation>H. Màn kết quả dùng chung một khuôn</h2>
    <div class="cols">
      <figure class="bad"><figcaption data-annotation><b>Sai</b>Tiêu đề chung chung, dòng giải thích hệ thống, không thấy đối tượng và giờ</figcaption>
        <div class="phone"><div class="stack center">
          <div class="ok-icon"><svg viewBox="0 0 24 24" stroke-width="2"><path d="M5 12l5 5 9-10"/></svg></div>
          <h3 style="font-size:22px">Thành công!</h3>
          <p class="muted">Hệ thống đã gửi thông báo tới phụ huynh và giáo viên liên quan.</p>
          <button class="btn btn-primary" type="button">OK</button>
        </div></div>
      </figure>
      <figure class="good"><figcaption data-annotation><b>Đúng</b>Icon và "Đã …"; thẻ người; thẻ đậm khoá–giá trị kết thúc bằng "… lúc"; một dòng tóm tắt; nút</figcaption>
        <div class="phone"><div class="stack">
          <div class="ok-icon"><svg viewBox="0 0 24 24" stroke-width="2"><path d="M5 12l5 5 9-10"/></svg></div>
          <h3 class="center" style="font-size:22px">Đã chuyển lịch</h3>
          <div class="card" style="display:flex;align-items:center;gap:12px"><span class="avatar">GH</span><span><b>Trần Gia Hân</b><br><span class="t-label">HS0412</span></span></div>
          <div class="kv">
            <div class="row"><span class="grow">Môn</span><span class="val">Toán</span></div>
            <div class="row"><span class="grow">Lịch mới</span><span class="val">Thứ Ba, Thứ Năm 17:30</span></div>
            <div class="row"><span class="grow">Áp dụng từ</span><span class="val">Thứ Hai 3/11</span></div>
            <div class="row"><span class="grow">Chuyển lúc</span><span class="val">14:20 Thứ Năm 30/10</span></div>
          </div>
          <p class="center">Từ Thứ Hai 3/11, Gia Hân học Toán Thứ Ba và Thứ Năm.</p>
          <button class="btn btn-primary" type="button">Về tổng quan</button>
          <button class="btn btn-ghost" type="button">Xem lịch học</button>
        </div></div>
      </figure>
    </div>
  </section>

  <!-- I -->
  <section class="pair" id="i" data-pair="i">
    <h2 data-annotation>I. Ba nhóm màu là đủ</h2>
    <div class="cols">
      <figure class="bad"><figcaption data-annotation><b>Sai</b>Năm màu trạng thái, màu nào cũng gào</figcaption>
        <div class="phone"><div class="card stack">
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <span class="chip" style="background:#dcfce7;color:#166534">Đã đến</span>
            <span class="chip" style="background:#dbeafe;color:#1e40af">Đang khám</span>
            <span class="chip" style="background:#fef3c7;color:#92400e">Chưa đến</span>
            <span class="chip" style="background:#fee2e2;color:#991b1b">Muộn</span>
            <span class="chip" style="background:#f3e8ff;color:#6b21a8">Đã gọi</span>
          </div>
        </div></div>
      </figure>
      <figure class="good"><figcaption data-annotation><b>Đúng</b>Trung tính cho việc bình thường, màu thương hiệu cho việc đang diễn ra, đỏ chỉ cho thứ cần xử lý</figcaption>
        <div class="phone"><div class="card stack">
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <span class="chip">Đã đến</span>
            <span class="chip chip-brand">Đang khám</span>
            <span class="chip">Chưa đến</span>
            <span class="chip chip-alert">Muộn 15 phút</span>
            <span class="chip chip-brand">Đã gọi</span>
          </div>
        </div></div>
      </figure>
    </div>
  </section>
</main>
</body>
</html>
